name: Ring Catcher Regression Tests
on:
  push:
    branches: [main]
    paths:
      - 'Portrait Breakout.html'
      - 'tests/ring-catcher.test.cjs'
      - 'tests/ring-browser-smoke.cjs'
      - 'tests/ring-first-level-benchmark.cjs'
      - 'tests/physics-core.test.cjs'
      - 'physics/physics-core.cjs'
      - '.github/workflows/ring-catcher-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Portrait Breakout.html'
      - 'tests/ring-catcher.test.cjs'
      - 'tests/ring-browser-smoke.cjs'
      - 'tests/ring-first-level-benchmark.cjs'
      - 'tests/physics-core.test.cjs'
      - 'physics/physics-core.cjs'
      - '.github/workflows/ring-catcher-tests.yml'
  workflow_dispatch:
jobs:
  ring-catcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/ring-catcher.test.cjs

  physics-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/physics-core.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.56.1
      - run: node tests/ring-browser-smoke.cjs

  first-level-benchmark:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.56.1
      - run: node tests/ring-first-level-benchmark.cjs
