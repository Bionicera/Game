        return {x:fx,half:halfW,eta:(i+1)*dt,paddleX:px,kind:'falling'};
      if(fy-halfH>H+30||fx<-60||fx>W+60)return null;
    }
    return null;
  }

  // 思考层：统一预测特殊关卡来袭危险物到达挡板平面的横向位置。
  // 这里保留与现有游戏更新一致的短时线性外推；更复杂的实体由专用物理预测器补充。
  function collectAutoThreats(){
    const threats = [];
    const maxEta = 1.35, plane = paddle.y;
    // 保留数组索引：真实 updateFalling() 逆序遍历，同帧多砖命中时先处理索引较大的砖。
    for(let i=0;i<falling.length;i++){
      const f=falling[i];
      threats.push({kind:'falling',source:f,sourceIndex:i});
    }
    // 俯冲敌机使用与 updateDivers() 一致的离散运动规则预测到达挡板平面的位置。
    // 预警期不会造成直接碰撞，故只预测已经进入 dive 阶段的敌机。
    for(let i=0;i<divers.length;i++) threats.push({kind:'diver',source:divers[i],sourceIndex:i});
    // 蛇头火箭按实际扫掠碰撞区预测；已进入挡板高度带的火箭保持紧急威胁。
    for(let i=0;i<snakeRockets.length;i++) threats.push({kind:'rocket',source:snakeRockets[i],sourceIndex:i});
    return threats;
  }

  // 按 updateFalling() 的冷却语义模拟一个候选轨迹上的多次落砖碰撞。
  // 碰撞物即使在无敌期也会消失，但只有 hitCooldown 归零时才会扣心并重置 1.15 秒。
  function scoreHazardCollisionSequence(events,initialCooldown=0){
    const priority={diver:0,falling:1,rocket:2};
    const ordered=events.slice().sort((a,b)=>
      a.eta-b.eta || (priority[a.kind]??9)-(priority[b.kind]??9) ||
      (b.sourceIndex||0)-(a.sourceIndex||0));
    let cooldown=Math.max(0,initialCooldown),lastEta=0,risk=0,minGap=Infinity;
    let damaging=0,ignored=0;
    for(const event of ordered){
      cooldown=Math.max(0,cooldown-Math.max(0,event.eta-lastEta));
      lastEta=Math.max(lastEta,event.eta);
      if(cooldown>0){ignored++;continue;}
      damaging++;
      minGap=Math.min(minGap,-event.overlap);
      risk+=(event.overlap+12)*1.25/(.12+event.eta);
      cooldown=event.cooldownDuration||1.15;
    }
    return {risk,minGap,damaging,ignored};
  }

  // 躲避层：在可行的挡板位置中评估危险物间隙与移动成本。
  // 优先选择能避开最早/最近威胁的位置；不可避免时尽量减少重叠程度。
  function chooseAutoEvasionTarget(attackTarget, threats){
    const lo = 2, hi = W - paddle.w - 2;
    const candidates = [clamp(attackTarget,lo,hi), clamp(paddle.x,lo,hi)];
    const count = 24;
    for(let i=0;i<=count;i++) candidates.push(lo+(hi-lo)*i/count);
    for(const h of threats){
      if(h.kind==='falling'||h.kind==='diver'||h.kind==='rocket') continue;
      candidates.push(clamp(h.x-paddle.w/2-h.half-8,lo,hi));
      candidates.push(clamp(h.x-paddle.w/2+h.half+8,lo,hi));
    }
    let best = clamp(attackTarget,lo,hi), bestScore = -Infinity;
    for(const x of candidates){
      const center=x+paddle.w/2;
      let minGap=Infinity, risk=0;
      const hazardEvents=[];
      for(const h of threats){
        let predicted=null;
        if(h.kind==='falling') predicted=predictFallingCollision(h.source,x);
        else if(h.kind==='diver') predicted=predictDiverThreat(h.source,paddle.y,H,x);
        else if(h.kind==='rocket') predicted=predictSnakeRocketThreat(h.source,x);
        if(!predicted)continue;
        const impactLeft=predicted.paddleX===undefined?x:predicted.paddleX;
        const impactCenter=impactLeft+paddle.w/2;
        const overlap=Math.max(0,paddle.w/2+predicted.half+7-Math.abs(impactCenter-predicted.x));
        if(overlap>0)hazardEvents.push({...predicted,kind:h.kind,overlap,sourceIndex:h.sourceIndex||0,
          cooldownDuration:predicted.cooldownDuration||1.15});
      }
      const hazardScore=scoreHazardCollisionSequence(hazardEvents,hitCooldown);
      risk+=hazardScore.risk;
      minGap=Math.min(minGap,hazardScore.minGap);
      const travel=Math.abs(x-paddle.x);
      const attackDrift=Math.abs(x-attackTarget);
      const earliestHazardEta=hazardEvents.length?Math.min(...hazardEvents.map(event=>event.eta)):Infinity;
      const reachable=Number.isFinite(earliestHazardEta)&&travel>PADDLE_MAX_V*Math.max(.04,earliestHazardEta);
      const score=Math.min(minGap, paddle.w*1.8)*2.2
        -risk*3.5-attackDrift*.42-travel*.12-(reachable?18:0);
      if(score>bestScore){bestScore=score;best=x;}
    }
    return best;
  }

  // 多球思考：锁定当前优先接球球体，只有新球明显更紧急时才切换。
  function selectAutoFocusBall(){
    const all=[ball,...extraBalls].filter(Boolean);
    const descending=all.map(o=>({o,eta:o.vy>0?(paddle.y-o.y)/o.vy:Infinity}))
      .filter(item=>item.eta>=0&&item.eta<Infinity);
    const best=descending.reduce((a,b)=>!a||b.eta<a.eta?b:a,null);
    const current=descending.find(item=>item.o===autoFocusBall);
    let chosen;
    if(current&&(!best||current.eta<=best.eta+.14)) chosen=current.o;
    else if(best) chosen=best.o;
    else chosen=all.includes(autoFocusBall)?autoFocusBall:ball;
    autoFocusBall=chosen;
    return chosen;
  }

  // 思考层：将当前局势归类，再由攻击/躲避/接球策略执行。
  function assessAutoSituation(focus){
    const eta=focus.vy>0?(paddle.y-focus.y)/focus.vy:Infinity;
    const threats=collectAutoThreats();
    const urgent=state==='playing'&&eta>=0&&eta<.18;
    const activeBalls=[ball,...extraBalls].filter(Boolean).length;
    const validPlan=aimPlan&&aimPlan.brick&&aimPlan.brick.alive?aimPlan:null;
    const intent=validPlan?(validPlan.chainCount>1?'attack':'aim'):'normal';
    // 生存优先级：紧急接球 > 危险躲避 > 多球协同 > 单球攻击/瞄准 > 普通定位。
    // 多球模式仍保留 intent，确保 HUD/诊断知道当前是在攻击还是单纯接球。
    const mode=urgent?'catch':threats.length?'dodge':activeBalls>1?'multiball':intent;
    return {mode,intent,eta,threats,urgent,activeBalls};
  }

  function autoTargetX(){
    // 多球时采用带滞回的优先球锁定，避免两颗球 ETA 接近时挡板反复换目标。
    const focus = selectAutoFocusBall();
    const r = focus.r;
    if(shape==='ring'&&levelType()===1&&ringSling.phase!=='idle'&&ringSling.focus===focus&&ringPlanner.skill!=='safe-catch')
      return clamp(ringSling.targetX,2,W-paddle.w-2);
    if(shape==='ring'&&levelType()===1&&ringPlanner.focus===focus&&['safe-catch','gap-guide','capture','guide'].includes(ringPlanner.skill)&&Number.isFinite(ringPlanner.targetX))
      return clamp(ringPlanner.targetX,2,W-paddle.w-2);
    // 弹珠台有弹力柱与扣命球袋，使用关卡专用前向模拟；不启用未经机关验证的攻击反推。
    if(isCurseLevel()){
      const predicted = focus.vy > 0 ? predictPlinkoLanding(focus) : null;
      const safeX = predicted && !predicted.pocketed ? predicted.x
        : (lastLandX || focus.x);
      if(predicted && !predicted.pocketed) lastLandX = predicted.x;
      return clamp(safeX-paddle.w/2,2,W-paddle.w-2);
    }
    let landX = focus.x;
    if(state === 'playing' && focus.vy > 0){
      // 曲面挡板各处高度差很大（三角形达 82px），要用「打算接球的那个部位」
      // 的高度算落地时间，否则挡板一移动落点就预测偏了
      const aimRel=aimPlan?aimPlan.rel:0;
      const contactY=shape==='ring'?ringAimContactY(aimRel,r):surfaceY(clamp((aimRel+1)/2,0,1))-r;
      const tt=Math.max(0,(contactY-focus.y)/focus.vy);
      landX=reflectScreenX(focus.x+focus.vx*tt,r);
      lastLandX=landX;
      if((aimTick++%3===0)||!aimPlan||(aimPlan.brick&&!aimPlan.brick.alive)){
        planAim(landX,focus);
        if(shape==='ring'&&aimPlan&&Number.isFinite(aimPlan.landX))landX=aimPlan.landX;
      }
    } else if(state === 'playing' && aimPlan && aimPlan.brick && !aimPlan.brick.alive){
      // 多球时目标砖常被辅球先打掉：只换目标、不改接球点，挡板不会突然横跳
      const keepRel=aimPlan.rel,offset=shape==='ring'?ringAimOffset(keepRel):keepRel*paddle.w/2;
      const want=(lastLandX||focus.x)-paddle.w/2-offset,Ux=paddleCommandVelocity(want,paddle.x);
      const out=shape==='ring'?ringAimReflect(focus.vx,focus.vy,keepRel,Ux,r):paddleReflect(focus.vx,focus.vy,keepRel,Ux);
      const ang=Math.atan2(out.vx,-out.vy);
      const aimY=shape==='ring'?ringAimContactY(keepRel,r):surfaceY(clamp((keepRel+1)/2,0,1));
      const hit=predictFirstBrick(lastLandX||focus.x,aimY,ang,r);
      if(hit) aimPlan = {cost:0, rel:keepRel, Ux, brick:hit.b, err:0, need:ang, tx:hit.x};
    }
    const rel=aimPlan?aimPlan.rel:0;
    // 一个瞄准坐标：普通挡板按有效宽度映射，圆环按半径映射到捕捉/攻击决策区。
    const aimOffset=shape==='ring'?ringAimOffset(rel):rel*paddle.w/2;
    let target=clamp(landX-paddle.w/2-aimOffset,2,W-paddle.w-2);
    // 保命优先：真要漏接了就放弃瞄准，用中心把球接住再说
    if(state === 'playing' && focus.vy > 0 &&
       (landX < target + 2 || landX > target + paddle.w - 2))
      target = clamp(landX - paddle.w / 2, 2, W - paddle.w - 2);
    // 四大智能环节中的「躲避」：独立收集落砖、俯冲敌机与蛇头火箭的预计撞击点。
    // 球进入最后接球窗口时，接球安全优先级最高，不允许躲避逻辑把挡板带离球路。
    const decision = assessAutoSituation(focus);
    autoMode = decision.mode;
    autoIntent = decision.intent;
    if(decision.mode === 'dodge')
      target = chooseAutoEvasionTarget(target, decision.threats);
    return target;
  }

  // 砖块当前实际矩形：俯冲中的砖跟着敌机走，其余随编队整体摆动
  // 所有碰撞、绘制、瞄准预测都走这里，避免「画在这儿、判定在那儿」
  function brickRect(b){
    if(b.dive) return {x:b.dive.x - b.w / 2, y:b.dive.y - b.h / 2, w:b.w, h:b.h};
    const x = b.x + (isDiveLevel() ? formationSway : 0);
    return {x, y:b.y, w:b.w, h:b.h};
  }
  // 敌机实体碰撞框覆盖旋转后的机翼与机头；尾焰属于特效，不计入受击范围。
  function diverRect(d){
    const angle = d.rot || 0, c = Math.abs(Math.cos(angle)), s = Math.abs(Math.sin(angle));
    const hw = (d.w + 14) / 2, hh = (d.h + 8) / 2;
    const cx = -Math.sin(angle) * 4, cy = Math.cos(angle) * 4;
    const ex = c * hw + s * hh, ey = s * hw + c * hh;
    return {x:d.x + cx - ex, y:d.y + cy - ey, w:ex * 2, h:ey * 2};
  }

  /*
   * 统一空间索引（逻辑世界坐标，单位为 CSS px）：
   * 实体保持连续坐标和真实尺寸；网格只负责宽相位候选筛选，不吸附或改变实体。
   * 一个实体可以同时登记在多个格子里，因此大砖块、Boss、蛇身和移动敌机
   * 都可以共享同一空间索引。精确碰撞仍由各自的窄相位几何判定完成。
   */
  class SpatialGrid {
    constructor(cellSize){
      this.cellSize = Math.max(8, cellSize || 24);
      this.cells = new Map();
      this.order = new Map();
    }
    clear(){ this.cells.clear(); this.order.clear(); }
    key(x, y){ return x + ',' + y; }
    insert(item, rect, order){
      if(!rect || rect.w <= 0 || rect.h <= 0) return;
      this.order.set(item, order);
      const s = this.cellSize;
      const x0 = Math.floor(rect.x / s), y0 = Math.floor(rect.y / s);
      const x1 = Math.floor((rect.x + rect.w) / s), y1 = Math.floor((rect.y + rect.h) / s);
      for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){
        const key = this.key(x, y);
        let bucket = this.cells.get(key);
        if(!bucket){ bucket = []; this.cells.set(key, bucket); }
        bucket.push(item);
      }
    }
    rebuild(items, rectOf){
      this.clear();
      for(let i = 0; i < items.length; i++){
        const item = items[i];
        if(item && item.alive) this.insert(item, rectOf(item), i);
      }
    }
    queryAABB(rect, sourceLayer){
      const found = new Set(), out = [];
      const s = this.cellSize;
      const x0 = Math.floor(rect.x / s), y0 = Math.floor(rect.y / s);
      const x1 = Math.floor((rect.x + rect.w) / s), y1 = Math.floor((rect.y + rect.h) / s);
      for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){
        const bucket = this.cells.get(this.key(x, y));
        if(!bucket) continue;
        for(const item of bucket){
          if(sourceLayer != null && !((item.collisionMask || 0) & sourceLayer)) continue;
          if(!found.has(item)){ found.add(item); out.push(item); }
        }
      }
      // 保持旧版按 bricks 数组顺序处理碰撞的行为，避免改变同帧多重重叠时的优先级。
      out.sort((a, b) => this.order.get(a) - this.order.get(b));
      return out;
    }
  }
  const worldGrid = new SpatialGrid(24);

  // 统一棋盘尺子：逻辑格子始终为正方形，关卡只决定占用多少格。
  // 视口变化只重新计算格子到 CSS 像素的映射；实体的行列与占格数不变。
  // Canvas 的 DPR 变换在 resize() 中单独处理，这里不再做第二次缩放。
  function boardRuler(slotRows){
    const rowSlots = Math.max(1, slotRows || rows);
    // 先保证边距和间距不会吃掉可用空间；极端窄屏/短屏时允许间距缩小，
    // 单元格只由宽高共同约束，绝不设置最小像素尺寸把棋盘硬撑出画布。
    const sideInset = Math.min(padX, Math.max(0, (W - 1) / 2));
    const usableW = Math.max(0, W - sideInset * 2);
    const gapX = cols > 1 ? usableW / (cols - 1) : gap;
    const gapY = rowSlots > 1 ? Math.max(0, area) / (rowSlots - 1) : gap;
    const cellGap = Math.max(0, Math.min(gap, gapX, gapY));
    const cellW = Math.max(0, (usableW - cellGap * (cols - 1)) / Math.max(1, cols));
    const cellH = Math.max(0, (Math.max(0, area) - cellGap * (rowSlots - 1)) / rowSlots);
    const cell = Math.max(0, Math.min(cellW, cellH));
    const step = cell + cellGap;
    const gridW = cols * cell + (cols - 1) * cellGap;
    const gridH = rowSlots * cell + (rowSlots - 1) * cellGap;
    const originX = (W - gridW) / 2;
    const originY = topInset + (Math.max(0, area) - gridH) / 2;
    return {
      cell, gap:cellGap, step, originX, originY, gridW, gridH,
      rect(r, c, spanX, spanY){
        const sx = Math.max(1, spanX || 1), sy = Math.max(1, spanY || 1);
        return {
          x: originX + c * step,
          y: originY + r * step,
          w: cell * sx + cellGap * (sx - 1),
          h: cell * sy + cellGap * (sy - 1)
        };
      },
      center(r, c){
        return {x:originX + c * step + cell / 2,
          y:originY + r * step + cell / 2, size:cell};
      }
    };
  }
  function layoutBricks(){
    // 第一关专属：把砖块排成多层嵌套彩虹弧；只改变实体坐标，碰撞/预测继续共用 brickRect。
    if(level === 1 && levelType() === LT.CLASSIC){
      const alive = bricks.filter(b => b && b.alive);
      const bandCount = Math.max(1, rows);
      const thetaMax = 1.05;
      const baseY = topInset + area * .96;
      const outerRy = area * .76;
      const ryStep = bandCount > 1 ? area * .50 / (bandCount - 1) : 0;
      // 第一关沿用统一棋盘标尺：弧形只改变位置，每块砖仍是标准正方形。
      const brickSide = boardRuler(rows).cell;
      const bandSlots = new Map();
      for(const b of alive){
        const band = clamp(b.r, 0, bandCount - 1);
        if(!bandSlots.has(band)) bandSlots.set(band, []);
        bandSlots.get(band).push(b);
      }
      for(const [band, items] of bandSlots){
        items.sort((a,z) => a.c-z.c);
        const rx = W * (.46 - .022 * band);
        const ry = Math.max(brickSide + 3, outerRy - ryStep * band);
        const count = items.length;
        const angularStep = count > 1 ? (2 * thetaMax) / (count - 1) : 0;
        items.forEach((b,index) => {
          const theta = count > 1
            ? -thetaMax + angularStep * index
            : 0;
          b.layoutVisible = true;
          b.layoutR = b.r; b.layoutC = b.c;
          b.layoutSpanX = 1; b.layoutSpanY = 1;
          b.w = brickSide; b.h = brickSide;
          b.x = W * .5 + rx * Math.sin(theta) - brickSide / 2;
          b.y = baseY - ry * Math.cos(theta) - brickSide / 2 + brickSide;
        });
      }
      for(const b of bricks) if(!b.alive) b.layoutVisible = false;
      rowCount = rows;
      return;
    }

    if(isSnakeLevel()){
      rowCount = rows; // 蛇关也要同步颜色渐变等依赖的实际行数。
      const ruler = boardRuler(rows);
      for(const b of bricks){
        b.layoutVisible = !!b.alive;
        b.layoutR = b.r; b.layoutC = b.c;
        b.layoutSpanX = 1; b.layoutSpanY = 1;
        const rect = ruler.rect(b.r, b.c);
        b.x = rect.x; b.y = rect.y; b.w = rect.w; b.h = rect.h;
      }
      return;
    }

    // 第八关：小方砖分布在上半部的双层弧线上，整体明显上移并留出下方弹珠区。
    if(isCurseLevel()){
      const top = topInset + 38;
      const bottom = Math.min(topInset + H * .31, top + H * .25);
      const cx = W * .5, cy = top + (bottom - top) * .48;
      const rings = [
        {rx:W * .235, ry:H * .055},
        {rx:W * .405, ry:H * .115}
      ];
      const alive = bricks.filter(b => b && b.alive);
      const perRing = Math.ceil(alive.length / 2);
      const side = clamp(W * .052, 17, 23);
      alive.forEach((b,index) => {
        const ringIndex = index < perRing ? 0 : 1;
        const ring = rings[ringIndex];
        const slot = ringIndex === 0 ? index : index - perRing;
        const count = ringIndex === 0 ? perRing : alive.length - perRing;
        const angle = -Math.PI/2 + (slot / Math.max(1,count)) * Math.PI*2
                      + (ringIndex ? Math.PI/Math.max(1,count) : 0);
        b.layoutVisible = true;
        b.layoutR = b.r; b.layoutC = b.c;
        b.layoutSpanX = 1; b.layoutSpanY = 1;
        b.w = side;
        b.h = side;
        b.x = clamp(cx + Math.cos(angle)*ring.rx - side/2, 5, W-side-5);
        b.y = clamp(cy + Math.sin(angle)*ring.ry - side/2, top, bottom-side);
      });
      for(const b of bricks) if(!b.alive) b.layoutVisible = false;
      rowCount = rows;
      return;
    }

    // 统一逻辑网格：实体可占用多个基础单元；先放大实体，再给其余实体分配空位。
    // spanX/spanY 是期望占用量，layoutSpanX/layoutSpanY 是实际分配量。
    const occupied = Array.from({length:rows}, () => Array(cols).fill(false));
    const entries = bricks.filter(b => b && b.alive).map((b, index) => ({
      b, index,
      sx:clamp(Math.floor(b.spanX || 1), 1, cols),
      sy:clamp(Math.floor(b.spanY || 1), 1, rows)
    }));
    entries.sort((a, z) => (z.sx*z.sy - a.sx*a.sy) || a.index - z.index);

    const fits = (r, c, sx, sy) => {
      if(r < 0 || c < 0 || r + sy > rows || c + sx > cols) return false;
      for(let y=r; y<r+sy; y++) for(let x=c; x<c+sx; x++)
        if(occupied[y][x]) return false;
      return true;
    };
    const locate = (entry, sx, sy) => {
      let best = null, bestScore = Infinity;
      const ar = clamp(entry.b.r, 0, rows - 1), ac = clamp(entry.b.c, 0, cols - 1);
      for(let r=0; r<=rows-sy; r++) for(let c=0; c<=cols-sx; c++){
        if(!fits(r,c,sx,sy)) continue;
        const score = Math.abs(r-ar) + Math.abs(c-ac);
        if(score < bestScore){ bestScore=score; best={r,c}; }
      }
      return best;
    };

    for(const entry of entries){
      const b = entry.b;
      let sx=entry.sx, sy=entry.sy, pos=locate(entry,sx,sy);
      // 空间不足时逐级缩小占用面积，尽量保留实体而不是让它消失。
      while(!pos && (sx>1 || sy>1)){
        if(sx >= sy && sx>1) sx--;
        else if(sy>1) sy--;
        else sx--;
        pos=locate(entry,sx,sy);
      }
      if(!pos){
        b.retire(); b.layoutVisible=false; b.w=0; b.h=0;
        continue;
      }
      for(let y=pos.r; y<pos.r+sy; y++)
        for(let x=pos.c; x<pos.c+sx; x++) occupied[y][x]=true;
      b.layoutVisible=true;
      b.layoutR=pos.r; b.layoutC=pos.c;
      b.layoutSpanX=sx; b.layoutSpanY=sy;
    }

    rowCount = 1;
    for(const b of bricks){
      if(!b.alive || !b.layoutVisible) continue;
      if(b.layoutR + b.layoutSpanY > rowCount) rowCount=b.layoutR+b.layoutSpanY;
    }
    const rc = Math.max(1, rowCount);
    const ruler = boardRuler(rc);
    for(const b of bricks){
      if(!b.alive || !b.layoutVisible) continue;
      const rect = ruler.rect(b.layoutR, b.layoutC, b.layoutSpanX, b.layoutSpanY);
      b.x = rect.x; b.y = rect.y; b.w = rect.w; b.h = rect.h;
    }
    for(const b of bricks) if(!b.alive) b.layoutVisible=false;
  }
  function makeStars(){
    stars = [];
    const n = Math.round(clamp(W * H / 14000, 22, 55));
    for(let i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + .4, a: Math.random() * .5 + .12,
      s: Math.random() * 6 + 3, p: Math.random() * 6.28
    });
  }

  /* ---------- 砖块：阵型与类型 ---------- */
  // 每关换一种阵型，但保证每一行都至少有砖，砖块区高度不变
  const PATTERNS = ['solid', 'checker', 'pyramid', 'diamond', 'wave', 'gates'];
  function patternAt(name, r, c, rows, cols){
    const mid = (cols - 1) / 2, rmid = (rows - 1) / 2;
    switch(name){
      case 'checker': return (r + c) % 2 === 0 || r % 3 === 0;
      case 'pyramid': return Math.abs(c - mid) <= 1.05 + (r / Math.max(1, rows - 1)) * mid;
      case 'diamond': return Math.abs(c - mid) / Math.max(1, mid) + Math.abs(r - rmid) / Math.max(1, rmid) <= 1.15 || Math.abs(c - mid) < 1.6;
      case 'wave':    { const hole = (Math.floor(r * 1.6) + level) % cols;
                        return c !== hole && c !== (hole + 1) % cols; }
      case 'gates':   return Math.abs(c - mid) > 1.05 || r % 3 === 0;
      default:        return true;   // 实心
    }
  }
  // 按比例撒点而非纯随机，保证每种关卡的特殊砖数量稳定可控
  function assignTypes(){
    const t = levelType(), total = bricks.length, pool = bricks.slice();
    if(t === LT.GALAGA || t === LT.SNAKE || t === LT.CURSE) return;   // 这两种由专用构建器接管
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    const take = (type, n) => {
      for(let k = 0; k < n && pool.length; k++){
        const b = pool.pop(); b.type = type; b.hp = type === 'tough' ? 2 : 1;
      }
    };
    if(t === LT.CLASSIC && level === 1) return;      // 教学关全普通
    if(t === LT.CARNIVAL){
      take('bonus', clamp(Math.round(total * .22), 6, 16));
      take('multi', clamp(Math.round(total * .10), 3, 7));
      take('slow',  clamp(Math.round(total * .05), 1, 4));

    if(beatStep===4 || beatStep===12) musicNoise(at,.075,.018,false);
    if(beatStep===2 || beatStep===6 || beatStep===10 || beatStep===14) musicNoise(at,.022,.006,true);
    if(barIndex===3 && beatStep>=12 && beatStep%2===0) musicNoise(at,.035,.011,false);

  function musicScheduler(){
    if(!musicStarted || !musicEnabled || !actx || actx.state!=='running') return;
    const horizon=actx.currentTime+.18;

      scheduleMusicStep(musicStep,musicNextTime);
      musicNextTime+=MUSIC_STEP;
      musicStep=(musicStep+1)%MUSIC_STEPS;

  // 统一音乐电平：平滑淡入淡出，避免开关/暂停时突然跳响度

  function startBattleMusic(){

      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();

        // 低通先收敛刺耳高频，再压缩峰值；最终输出留足余量
        musicFilter=actx.createBiquadFilter(); musicFilter.type='lowpass';
        musicFilter.frequency.value=4800; musicFilter.Q.value=.3;
        musicComp=actx.createDynamicsCompressor();
        musicComp.threshold.value=-24; musicComp.knee.value=22; musicComp.ratio.value=4.5;
        musicComp.attack.value=.012; musicComp.release.value=.26;
        musicMakeup=actx.createGain(); musicMakeup.gain.value=1.25;
        musicMaster=actx.createGain(); musicMaster.gain.value=0;
        musicMaster.connect(musicFilter); musicFilter.connect(musicComp);
        musicComp.connect(musicMakeup); musicMakeup.connect(actx.destination);
      }
      musicEnabled=true;
      $('btnMusic').textContent='♫'; $('btnMusic').setAttribute('aria-pressed','true');
      $('btnMusic').setAttribute('aria-label','关闭背景音乐');
      setMusicLevel(state==='paused'?0:MUSIC_OUTPUT_LEVEL,.28);

  // 移动浏览器禁止无交互自动发声：封面照常自动淡出，音乐在玩家首次触摸/按键后解锁。

  /* ---------- UI ---------- */
  // 实测速率倍率是连续量：每几帧刷新一次读数，而不是只在得分/掉球时才变
  let hudTick = 0;

  /* ---------- 物理 ---------- */
  function update(dt){
    time += dt;
    if(shape==='ring'){
      // Sensor / State / Planner / Skills 锁定同一个 Auto 焦点球，避免多球时感知主球却追踪辅球。
      const ringFocus=autoPilot?selectAutoFocusBall():ball;
      const sensed=updateRingSensor(dt,ringFocus);
      updateRingState(sensed,dt,ringFocus);
      // 先更新本帧安全仲裁，再推进甩球状态，避免执行器读取上一帧的过期优先级。
      updateRingPlanner(dt,ringFocus);
      updateRingSling(dt,ringFocus);
    }else{
      updateRingSensor(0,null);
      ringState.valid=false;ringState.hold=0;
      updateRingSling(0,null);
      updateRingPlanner(0,null);
    }
    if(shape==='ring' && (state==='playing' || (state==='serving' && ringMood.face==='😣' && ringMood.t>0))){
      ringMood.t=Math.max(0,ringMood.t-dt);
      ringMood.cooldown=Math.max(0,ringMood.cooldown-dt);
      ringMood.comboT=Math.max(0,ringMood.comboT-dt);
      if(ringMood.comboT===0) ringMood.streak=0;
      // 落空表情持续半秒后明确切回🤪，不再随机抽到另一个负面表情。
      if(state==='playing' && ringMood.t===0 && ringMood.resumeFlight){
        ringMood.resumeFlight=false;
        ringMood.face='🤪';ringMood.t=.65;ringMood.cooldown=.65;
      }
      // 球高速下坠且偏离圆环中心时，先抽取一次险些失误事件。
      if(state==='playing' && ringMood.t===0 && ringMood.cooldown===0 &&
         ball.vy>0 && ball.y>H-Math.max(86,ball.r*11) &&
         Math.abs(ball.x-(paddle.x+paddle.w/2))>paddle.w*.43 && ringMoodRandom()<.12){
        ringMoodEvent('😱',.85);
      }
      // 飞行表情按概率抽取：🤪最常见，偶尔😂或😣，只影响视觉。
      if(state==='playing' && ringMood.t===0 && ringMood.cooldown===0){
        const roll=ringMoodRandom();
        ringMood.face=roll<.72?'🤪':(roll<.86?'😂':'😣');
        ringMood.t=.9+ringMoodRandom()*.45;
        ringMood.cooldown=1.7+ringMoodRandom()*2.1;
      }
    } else if(state!=='paused'){
      ringMood.t=0;
    }
    if(level === 1 && firstLevelIntroT > 0 && state !== 'paused')
      firstLevelIntroT = Math.max(0, firstLevelIntroT - dt);
    if((hudTick++ % 6) === 0) syncSpeedHUD();   // 实测倍率连续读数
    // 减速倒计时：暂停时不消耗；归零后按原比例把阻尼冲量撤掉
    if(state !== 'paused' && slowT > 0){
      slowT = Math.max(0, slowT - dt);
      if(slowT === 0){
        scaleAllSpeeds(1 / SLOW_FACTOR);
        toastMsg('恢复 · 速度 ×' + (1 / SLOW_FACTOR).toFixed(2));
        beep(620, .1, 'triangle', .045);
        syncUI();
      }
    }
    if(state !== 'serving') autoServeT = .5;   // 每次重新进入待发球，都给半秒准备
    if(state !== 'paused' && autoPilot) paddle.targetX = autoTargetX();
    if(state !== 'paused'){
      if(isFortressLevel()){
        const half = W*.14;
        fortressGateX += fortressGateDir * fortressGateSpeed() * dt;
        if(fortressGateX < half+4){ fortressGateX=half+4; fortressGateDir=1; }
        if(fortressGateX > W-half-4){ fortressGateX=W-half-4; fortressGateDir=-1; }
      }
      const prevPX = paddle.x;
      const desiredPXV = paddleCommandVelocity(paddle.targetX, paddle.x);
      paddle.x += desiredPXV * dt;
      paddle.vx = (paddle.x - prevPX) / Math.max(dt, .001);

      // Galaga 敌机在物理子步内与球同步推进；待发球时才按整帧更新。
      // 避免敌机只按上一帧或本帧终点位置参与碰撞检测。
      if(isDiveLevel()){
        formationSway = (Math.sin(time * 1.55) * .75 + Math.sin(time * 3.1) * .25)
                      * Math.min(W * .06, 25);
        if(state === 'playing'){
          diveTimer -= dt;
          if(diveTimer <= 0){
            launchDiver();
            diveTimer = Math.max(.7, 1.7 - level * .02) + Math.random() * .5;
          }
        } else {
          // 待发球时没有物理子步，敌机仍按整帧推进。
          updateDivers(dt);
          updateRespawns(dt);
        }
      }

      if(state === 'serving'){
        snapBall();   // 球贴着挡板随挡板移动
        if(autoPilot){
          autoServeT -= dt;
          if(autoServeT <= 0) launch();   // 自动驾驶：不用点，自己开球
        }
      } else if(state === 'playing'){
        // 按场上「实际」最大速率拆子步（不是标称速率）：挡板做功加速后同样不穿砖、不漏接
        let vmax = Math.hypot(ball.vx, ball.vy);
        for(const e of extraBalls) vmax = Math.max(vmax, Math.hypot(e.vx, e.vy));
        if(isDiveLevel()){
          let diverVmax = 0;
          for(const d of divers) if(d.alive && d.phase !== 'warn')
            diverVmax = Math.max(diverVmax, Math.hypot(d.vx, d.vy));
          // 以球与敌机的相对速度估算子步，避免快敌机在两个碰撞样本间跨过球。
          vmax += diverVmax;
        }
        const steps = clamp(Math.ceil(vmax * dt / 6), 3, 96), sdt = dt / steps;
        // 球与 Galaga 敌机使用相同的物理子步，避免敌机整帧瞬移后只检查一个位置。
        // 非 Galaga 关卡的砖块静态，整帧只需重建一次；Galaga 每个子步同步更新并重建。
        for(let s = 0; s < steps; s++){
          if(state !== 'playing') break;   // 掉球/通关后立刻停，避免同帧重复判定
          if(isDiveLevel()){
            const simTime = time - dt + (s + 1) * sdt;
            formationSway = (Math.sin(simTime * 1.55) * .75 + Math.sin(simTime * 3.1) * .25)
                          * Math.min(W * .06, 25);
            updateDivers(sdt);
            updateRespawns(sdt);
            if(state !== 'playing') break;
          }
          if(isDiveLevel() || s === 0){
            const diverByBrick = new Map();
            for(const d of divers) if(d.alive && d.b) diverByBrick.set(d.b, d);
            const colliders = [];
            for(const b of bricks){
              if(!b.alive) continue;
              const d = diverByBrick.get(b);
              colliders.push(d && d.phase !== 'warn' ? d : b);
            }
            worldGrid.rebuild(colliders, item => item.entityKind === 'galaga-diver'
              ? diverRect(item) : brickRect(item));
          }
          const paddleStepStart=prevPX+(paddle.x-prevPX)*(s/steps);
          const paddleStepEnd=prevPX+(paddle.x-prevPX)*((s+1)/steps);
          stepBall(sdt,paddleStepStart,paddleStepEnd);
          if(state === 'playing') stepExtraBalls(sdt,paddleStepStart,paddleStepEnd);
        }
        if(state === 'playing'){
          trail.push({x:ball.x, y:ball.y});
          const trailMax = Math.round(clamp(11 + (liveMult() - 1) * 9, 11, 32));
          while(trail.length > trailMax) trail.shift();
        } else if(trail.length) trail.shift();
      }
    }

    if(state !== 'paused') updateFalling(dt);
    if(isSnakeLevel() && state !== 'paused'){ updateSnake(dt); updateSnakeRockets(dt); }
    if(isTrapLevel() && state !== 'paused') updateBleed(dt);
    if(isCurseLevel() && state !== 'paused') updateCurse(dt);
    checkClear();   // 落砖关要等空中落砖全部清理完才进下一关

    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 460 * dt; p.life -= dt;
      if(p.life <= 0) particles.splice(i, 1);
    }
    for(let i = waves.length - 1; i >= 0; i--){ waves[i].t -= dt; if(waves[i].t <= 0) waves.splice(i, 1); }
    for(let i = floaters.length - 1; i >= 0; i--){ floaters[i].t -= dt; if(floaters[i].t <= 0) floaters.splice(i, 1); }
    if(shake > 0) shake = Math.max(0, shake - dt * 26);
    for(const b of bricks) if(b.flash > 0) b.flash = Math.max(0, b.flash - dt * 4);
    if(toast){ toast.t -= dt; if(toast.t <= 0) toast = null; }
    if(hitFx){ hitFx.t -= dt; if(hitFx.t <= 0) hitFx = null; }
  }

  function stepBall(dt, paddleStartX, paddleEndX){
    const px = ball.x, py = ball.y;
    if(curse && state === 'playing' && !isCurseLevel()){
      if(curse.spinT > 0){
        const om = .55 * dt, c = Math.cos(om), si = Math.sin(om);
        const vx0 = ball.vx, vy0 = ball.vy;
        ball.vx = vx0*c - vy0*si; ball.vy = vx0*si + vy0*c;
      }
      if(curse.gravityT > 0) ball.vy += 240 * dt;
    }
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    const r = ball.r;

    if(ball.x - r < 2){ ball.x = 2 + r; ball.vx = Math.abs(ball.vx); beep(300,.03,'sine',.025); }
    if(ball.x + r > W - 2){ ball.x = W - 2 - r; ball.vx = -Math.abs(ball.vx); beep(300,.03,'sine',.025); }
    if(ball.y - r < 2){ ball.y = 2 + r; ball.vy = Math.abs(ball.vy); beep(360,.03,'sine',.025); }

    if(isFortressLevel()) collideFortressWalls(ball, px, py);

    // 月牙必须区分内弧与外弧：内弧向上反弹，外弧向下反弹。
    if(shape === 'moon') moonContact(ball,px,py,true,paddleStartX,paddleEndX);
    else if(shape === 'ring') ringContact(ball,px,py,true,paddleStartX,paddleEndX);
    else shapedPaddleContact(ball,px,py,true,paddleStartX,paddleEndX);

    // 弹珠台弹力柱与球袋碰撞。
    if(isCurseLevel()) {
      for(const p of plinkoBumpers){
        const hit=plinkoSweepCircleContact(px,py,ball.x,ball.y,r,p);
        if(hit){
          const {nx,ny,minD}=hit;
          ball.x=p.x+nx*(minD+.5);ball.y=p.y+ny*(minD+.5);
          const dot=ball.vx*nx+ball.vy*ny;
          if(dot<0){ball.vx=(ball.vx-2*dot*nx)*1.035;ball.vy=(ball.vy-2*dot*ny)*1.035;}
          spawnParticles(p.x+nx*p.r,p.y+ny*p.r,'#65eaff',7);
          waves.push({x:p.x,y:p.y,r0:p.r*.6,max:p.r*.9,t:.22,life:.22,color:'#65eaff'});
          beep(520+Math.random()*180,.045,'triangle',.035);return;
        }
      }
      for(const h of plinkoPockets){
        if(plinkoSweepPocketHit(px,py,ball.x,ball.y,h)){
          spawnParticles(h.x,h.y,'#ff557e',18); shake=Math.max(shake,9);
          toastMsg('🕳 掉进球袋 · 扣 1 ♥'); loseLife(); return;
        }
      }
    }

    // 砖块（一次只处理一处碰撞）；俯冲中的敌机也能被球击落
    for(const b of worldGrid.queryAABB({x:ball.x-r, y:ball.y-r, w:r*2, h:r*2}, COLLISION_LAYER.PROJECTILE)){
      if(!b.alive) continue;
      const q = b.entityKind === 'galaga-diver' ? diverRect(b) : brickRect(b);
      if(ball.x + r < q.x || ball.x - r > q.x + q.w || ball.y + r < q.y || ball.y - r > q.y + q.h) continue;
      // 依据上一帧位置判断反弹轴
      if(py + r <= q.y || py - r >= q.y + q.h){
        ball.vy = -ball.vy;
        ball.y = py + (ball.vy > 0 ? -r - .5 : r + .5);
      } else {
        ball.vx = -ball.vx;
        ball.x = px + (ball.vx > 0 ? -r - .5 : r + .5);
      }
      const scoreBeforeHit=score;
      damageBrick(b.entityKind === 'galaga-diver' ? b.b : b);
      if(shape==='ring' && score>scoreBeforeHit){
        ringMood.streak=ringMood.comboT>0?ringMood.streak+1:1;
        ringMood.comboT=2.2;
        ringMoodEvent(ringMood.streak>=3?'😎':'😂',1.2);
      }
      return;
    }

    // 掉球：主球扣一颗心并停在挡板上待发射；辅球掉出底部直接消失、不扣血
    if(ball.y - r > H + 6){loseLife();return;}
    // 圆环专属“擦身而过”：没有进入实际碰撞半径、但贴近目标边缘时短暂😣。
    ringNearMiss(px,py,ball.x,ball.y,r);
  }

  // 额外球：独立物理，撞砖复用 damageBrick，掉出屏幕直接消失、不扣血
  function stepExtraBalls(dt, paddleStartX, paddleEndX){
    for(let i = extraBalls.length - 1; i >= 0; i--){
      const e = extraBalls[i];
      if(!e || state !== 'playing') continue;
      const px = e.x, py = e.y, r = e.r;
      if(curse){
        if(curse.spinT > 0){
          const om=.55*dt, c=Math.cos(om), si=Math.sin(om);
          const vx0=e.vx, vy0=e.vy; e.vx=vx0*c-vy0*si; e.vy=vx0*si+vy0*c;
        }
        if(curse.gravityT > 0) e.vy += 240*dt;
      }
      e.x += e.vx * dt; e.y += e.vy * dt;
      if(e.x - r < 2){ e.x = 2 + r; e.vx = Math.abs(e.vx); }
      if(e.x + r > W - 2){ e.x = W - 2 - r; e.vx = -Math.abs(e.vx); }
      if(e.y - r < 2){ e.y = 2 + r; e.vy = Math.abs(e.vy); }

      if(isFortressLevel()) collideFortressWalls(e, px, py);

      if(shape === 'moon') moonContact(e,px,py,false,paddleStartX,paddleEndX);
      else if(shape === 'ring') ringContact(e,px,py,false,paddleStartX,paddleEndX);
      else shapedPaddleContact(e,px,py,false,paddleStartX,paddleEndX);
      if(isCurseLevel()){
        let bumperHit=false;
        for(const p of plinkoBumpers){
          const hit=plinkoSweepCircleContact(px,py,e.x,e.y,r,p);
          if(!hit)continue;
          const {nx,ny,minD}=hit;
          e.x=p.x+nx*(minD+.5);e.y=p.y+ny*(minD+.5);
          const dot=e.vx*nx+e.vy*ny;
          if(dot<0){e.vx=(e.vx-2*dot*nx)*1.035;e.vy=(e.vy-2*dot*ny)*1.035;}
          spawnParticles(p.x+nx*p.r,p.y+ny*p.r,'#65eaff',5);
          waves.push({x:p.x,y:p.y,r0:p.r*.6,max:p.r*.9,t:.22,life:.22,color:'#65eaff'});
          bumperHit=true;break;
        }
        if(bumperHit){
          e.trail.push({x:e.x,y:e.y});
          if(e.trail.length>7)e.trail.shift();
          continue;
        }
        for(const pocket of plinkoPockets){
          if(plinkoSweepPocketHit(px,py,e.x,e.y,pocket)){
            e.retire();extraBalls.splice(i,1);break;
          }
        }
        if(!extraBalls.includes(e))continue;
      }
      for(const b of worldGrid.queryAABB({x:e.x-r, y:e.y-r, w:r*2, h:r*2}, e.collisionLayer)){
        if(!b.alive) continue;
        const q = b.entityKind === 'galaga-diver' ? diverRect(b) : brickRect(b);
        if(e.x + r < q.x || e.x - r > q.x + q.w || e.y + r < q.y || e.y - r > q.y + q.h) continue;
        if(py + r <= q.y || py - r >= q.y + q.h){
          e.vy = -e.vy; e.y = py + (e.vy > 0 ? -r - .5 : r + .5);
        } else {
          e.vx = -e.vx; e.x = px + (e.vx > 0 ? -r - .5 : r + .5);
        }
        damageBrick(b.entityKind === 'galaga-diver' ? b.b : b);
        if(state !== 'playing') return;
        break;
      }
      if(e.y - r > H + 6){ e.retire(); extraBalls.splice(i, 1); continue; }
      e.trail.push({x:e.x, y:e.y});
      if(e.trail.length > 7) e.trail.shift();
    }
  }

  function spawnParticles(x, y, color, n){
    for(let i = 0; i < n && particles.length < 260; i++) particles.push({
      x, y, vx: (Math.random() - .5) * 260, vy: (Math.random() - .5) * 260 - 60,
      s: Math.random() * 3.5 + 1.5, life: Math.random() * .35 + .3, color
    });
  }

  /* ---------- 减速砖：规则层换挡，不是把速率拉回标称 ---------- */
  // 减速砖：给全场速度一次性乘一个系数（相当于规则层的阻尼冲量）。
  // 各球之间由物理演化出的速率差异原样保留，不把谁拉回「标称值」。
  function scaleAllSpeeds(k){
    if(state === 'playing'){ ball.vx *= k; ball.vy *= k; }
    for(const e of extraBalls){ e.vx *= k; e.vy *= k; }
  }
  function applySlow(){
    const again = slowT > 0;
    slowT = SLOW_SECONDS;            // 不叠加：连吃也只刷新到 2 秒，不累计成 4、6 秒
    if(!again) scaleAllSpeeds(SLOW_FACTOR);
    toastMsg(again ? '减速续上 · ×' + SLOW_FACTOR.toFixed(2)
                   : '❄ 减速 ×' + SLOW_FACTOR.toFixed(2) + ' · ' + SLOW_SECONDS + ' 秒');
    floaters.push({x:ball.x, y:ball.y - 24, text:'SLOW', t:1, life:1, color:'#8ff2dd', size:13});
    beep(300, .14, 'sine', .05);
    syncUI();
  }

  /* ---------- 多球砖 ---------- */
  function spawnMultiBalls(src, srcRect){
    const room = MAX_BALLS - 1 - extraBalls.length;
    const n = Math.min(2, Math.max(0, room));
    if(!n) return;
    const q = srcRect || brickRect(src);
    const sp = speed(), cx = q.x + q.w / 2, cy = q.y + q.h / 2;
    for(let i = 0; i < n; i++){
      const a = (i === 0 ? -.6 : .6) + (Math.random() - .5) * .25;
      extraBalls.push(new GameEntity('extra-ball', {
        x: cx + (i === 0 ? -10 : 10), y: cy,
        vx: Math.sin(a) * sp, vy: -Math.abs(Math.cos(a) * sp),
        r: ball.r, trail: []
      }));
    }
    const count = extraBalls.length + 1;
    floaters.push({x:cx, y:cy, text:'✕' + count + ' 多球', t:1.1, life:1.1, color:'#dcb0ff', size:14});
    beep(740, .12, 'triangle', .05);
  }

  /* ---------- 砖块受伤：主球与额外球共用 ---------- */
  function triggerEffect(b, rect){
    if(isSnakeLevel()) return;            // 蛇身的特殊花纹只作外观，不额外触发效果
    if(b.type === 'slow') applySlow();
    if(b.type === 'multi') spawnMultiBalls(b, rect);
    if(b.type === 'bleed') startBleed();
    if(b.type === 'drunk' || b.type === 'spin' || b.type === 'half' || b.type === 'gravity')
      applyCurse(b.type);
  }
  function checkClear(){
    if(state !== 'playing' || falling.length) return;
    if(isSnakeLevel()){ if(snake && snake.cells.length === 0) nextLevel(); return; }
    if(isCurseLevel()){ if(bricks.length && bricks.every(b => !b.alive)) nextLevel(); return; }
    if(isDiveLevel()){
      // 不再要求凑满固定击落数，也不等待尚未生成的补位队列；
      // 场上没有存活敌机、也没有正在俯冲的敌机时立即通关。
      if(divers.length || bricks.some(b => b.alive)) return;
      respawnQueue.length = 0;
      respawnBudget = 0;
      nextLevel(); return;
    }
    if(!bricks.length) return;
    if(isTrapLevel()){
      // 陷阱与失血砖是负面砖，可留在场上；其余所有砖都必须清除。
      if(!bricks.some(b => b.alive && b.type !== 'trap' && b.type !== 'bleed')) nextLevel();
      return;
    }
    if(isFortressLevel()){
      // 堡垒关只有普通砖与耐久砖是清关目标；奖励砖/爆炸砖是附属障碍，不阻止通关。
      if(bricks.some(b => b.alive && (b.type === 'normal' || b.type === 'tough'))) return;
      nextLevel();
      return;
    }
    if(bricks.every(k => !k.alive)) nextLevel();
  }
  function scheduleRespawn(b){
    if(!isDiveLevel() || respawnBudget <= 0) return;
    respawnBudget--;
    respawnQueue.push({r:b.r, c:b.c, boss:!!b.boss, t:2.6 + Math.random()*1.4});
  }
  function damageBrick(b){
    const q = brickRect(b), t = levelType(), diveRef = b.dive;
    // 小蜜蜂：俯冲中可被击落且分值翻倍；刚归队/补位淡入时无敌（不伤球、不伤挡板）
    if(t === LT.GALAGA && b.respawn > 0){
      spawnParticles(q.x + q.w/2, q.y + q.h, '#ff9ad0', 3);
      beep(200, .035, 'square', .03);
      return;
    }
    // 贪吃蛇：身体可被击破；身体清空前蛇头免疫，最后击中蛇头才击杀
    if(t === LT.SNAKE){
      hitSnakeSegment(b, q);
      return;
    }
    // 陷阱砖：打到直接丢失主球、扣一颗心
    if(b.type === 'trap'){
      b.retire();
      spawnParticles(q.x + q.w/2, q.y + q.h/2, '#ff5c78', 12);
      waves.push({x:q.x + q.w/2, y:q.y + q.h/2, r0:4, max:60, t:.4, life:.4, color:'#ff5c78'});
      shake = Math.max(shake, 8);
      beep(140, .2, 'sawtooth', .06);
      toastMsg('☠ 踩中陷阱 · 主球丢失');
      checkClear();
      loseLife();
      return;
    }
    if(t === LT.DROP){
      // 落砖关：不炸、不碎、不连锁，整块砖脱落变成自由落体
      b.retire();
      spawnFalling(b);
      addScore(10 + (level - 1) * 2);
      if(b.type === 'bonus'){
        addScore(50);
        floaters.push({x:q.x + q.w/2, y:q.y, text:'+50', t:.85, life:.85, color:'#ffe38a', size:14});
      }
      triggerEffect(b, q);
      beep(b.type === 'bonus' ? 820 : 360, .055, 'triangle', .045);
    } else {
      b.hp -= dmgScale;               // half 诅咒：伤害永久减半
      b.flash = 1;
      if(t === LT.GALAGA) b.wounded = true;
      if(b.hp > 1e-6){
        addScore(10 + (level - 1) * 2);
        spawnParticles(ball.x, ball.y, brickPalette(b).a, 4);
        beep(300, .045, 'square', .04);
      } else {
        shatter(b, q);
        beep(b.type === 'bonus' ? 920 : (b.type === 'blast' ? 220 : 440 + b.r * 24),
             .055, b.type === 'bonus' ? 'triangle' : 'square', .045);
      }
      // 俯冲中击落得分翻倍（原版规则）
      if(t === LT.GALAGA) addScore(30 + (level - 1) * 2);
    }
    // 只有真正击落（不是擦伤）才撤销俯冲并安排补位；擦伤时敌机仍在俯冲、可继续受击
    if(!b.alive && diveRef){
      const k = divers.indexOf(diveRef);
      if(k >= 0) divers.splice(k, 1);
      galagaKills++;
      scheduleRespawn(b);
    }
    if(bleed && bleed.active && b.type === 'normal' && !b.alive) bleedOnBrick();
    checkClear();
  }

  /* ---------- 陷阱关：持续失血 + 一颗心补给 ---------- */
  const BLEED_SECONDS = 10, BLEED_NEED = 6;   // 提高挑战：10 秒内打掉 6 块普通砖
  function startBleed(){
    if(bleed && bleed.active){ bleed.t = BLEED_SECONDS; return; }
    bleed = {active:true, t:BLEED_SECONDS, need:BLEED_NEED, kills:0};
    toastMsg('☠ 持续失血 · ' + BLEED_SECONDS + ' 秒内打掉 ' + BLEED_NEED + ' 块砖');
    beep(180, .25, 'sawtooth', .06);
  }
  function bleedOnBrick(){
    bleed.kills++;
    // 期间每打掉一块砖补半颗心，但只补到 3 颗 —— 不让失血砖变成刷血机
    if(lives < 3) addLives(.5);
    if(bleed.kills >= bleed.need){
      bleed.active = false;
      toastMsg('✔ 止血成功 · 打掉 ' + bleed.need + ' 块砖');
      beep(720, .16, 'triangle', .06);
    }
  }
  function updateBleed(dt){
    if(!bleed || !bleed.active) return;
    bleed.t -= dt;
    if(bleed.t <= 0){
      bleed.active = false;
      lives = 0;
      toastMsg('☠ 失血过多 · 重新开局');
      resetGame();
    }
  }
  /* ---------- 诅咒关：负面砖 ---------- */
  function applyCurse(kind){
    if(!curse) curse = {drunkT:0, spinT:0, gravityT:0, friction:FRICTION};
    if(kind === 'half'){
      dmgScale = .5;                    // 本局永久：所有砖都要多打一下
      toastMsg('🌀 伤害永久减半 · 砖更耐打');
    } else {
      curse[kind + 'T'] = 6;
      if(kind === 'drunk') curse.friction = .04 + Math.random() * .9; // 挡板表面打滑
      const nm = {drunk:'失去准度 · 挡板打滑 6 秒', spin:'旋转球 · 球路会拐弯 6 秒',
                  gravity:'重力场 · 球被往下拽 6 秒'}[kind];
      toastMsg('🌀 ' + nm);
    }
    beep(260, .18, 'sawtooth', .05);
  }
  function updateCurse(dt){
    if(!curse) return;
    for(const k of ['drunkT','spinT','gravityT']) curse[k] = Math.max(0, curse[k] - dt);
  }
  /* ---------- 落砖关：砖块自由落体，挡板要躲 ---------- */
  function spawnFalling(b){
    // 保持危险物数量上限；满载时回收最早生成的一块，不能让刚击中的砖凭空消失。
    if(falling.length >= 90){
      const oldest = falling.shift();
      if(oldest) oldest.retire();
    }
    const q = brickRect(b);
    falling.push(new GameEntity('falling-brick', {
      x: q.x + q.w / 2, y: q.y + q.h / 2, py: q.y + q.h / 2,
      w: q.w, h: q.h,
      vx: clamp(ball.vx * .16, -150, 150) + (Math.random() - .5) * 45,
      vy: 60 + Math.random() * 50,
      rot: 0, vr: (Math.random() - .5) * 3.6,
      pal: brickPalette(b), seed: b.seed, t: 0
    }));
  }
  function updateFalling(dt){
    if(hitCooldown > 0) hitCooldown = Math.max(0, hitCooldown - dt);
    for(let i = falling.length - 1; i >= 0; i--){
      const f = falling[i];
      if(!f) continue;                    // 心用完重开时数组会被清空
      f.py = f.y;
      f.vy += 1050 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += f.vr * dt;
      f.t += dt;
      const halfW = f.w * .42, halfH = f.h * .42;
      const tt = clamp((f.x - paddle.x) / paddle.w, 0, 1);
      const sy = surfaceY(tt);
      const overlapX = f.x + halfW >= paddle.x && f.x - halfW <= paddle.x + paddle.w;
      const crossed = f.py + halfH <= sy + 6 && f.y + halfH >= sy - 2;
      const inside = f.y + halfH >= sy && f.y - halfH <= paddle.y + paddle.h + 6;
      if(f.vy > 0 && overlapX && (crossed || inside)){
        f.retire();
        falling.splice(i, 1);
        hitByHazard(f, '砖块');
        if(!falling.length) break;       // 可能已重开，数组被清空
        continue;
      }
      if(f.y - halfH > H + 30 || f.x < -60 || f.x > W + 60){
        f.retire();
        falling.splice(i, 1);
      }
    }
  }
  function hitByHazard(f, label){
    spawnParticles(f.x, f.y, '#ff9a6a', 10);
    shake = Math.max(shake, 10);
    beep(150, .18, 'sawtooth', .05);
    if(hitCooldown > 0) return;          // 短暂无敌：一堆砖同时砸下也只扣一颗
    hitCooldown = label === '俯冲' ? 1.8 : 1.15;
    lives = Math.max(0, lives - 1);
    floaters.push({x:f.x, y:Math.min(f.y, paddle.y - 34), text:'−1 ♥',
      t:1.1, life:1.1, color:'#ff7a6a', size:17});
    if(lives <= 0){
      resetGame();
      toastMsg(autoPilot ? '被砸光了 · Auto 自动重开' : '被砸光了 · 重新开局');
    } else {
      toastMsg(label + '砸中！还剩 ' + fmtLives());
    }
    syncUI();
  }
  function drawFalling(){
    for(const f of falling){
      const halfW = f.w / 2, halfH = f.h / 2;
      // 下方一截虚线轨迹，方便预判落点
      ctx.save();
      ctx.strokeStyle = 'rgba(255,150,90,.5)'; ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(f.x, f.y + halfH + 2);
      ctx.lineTo(f.x + f.vx * .07, f.y + halfH + 44); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();

      ctx.save();
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.shadowColor = '#ff7a4c';
      ctx.shadowBlur = 12 + 6 * Math.sin(time * 8 + f.seed);
      const g = ctx.createLinearGradient(-halfW, -halfH, halfW, halfH);
      g.addColorStop(0, f.pal.a); g.addColorStop(1, f.pal.b);
      ctx.fillStyle = g;
      roundRect(-halfW, -halfH, f.w, f.h, Math.min(5, f.h * .22)); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,185,125,.95)'; ctx.lineWidth = 1.6;
      roundRect(-halfW, -halfH, f.w, f.h, Math.min(5, f.h * .22)); ctx.stroke();
      // 警示斜纹
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-halfW * .55, -halfH * .55); ctx.lineTo(halfW * .05, halfH * .55);
      ctx.moveTo(halfW * .1, -halfH * .55); ctx.lineTo(halfW * .7, halfH * .55);
      ctx.stroke();
      ctx.restore();
    }
  }
  /* ---------- 贪吃蛇关：先清身体，最后击中蛇头 ---------- */
  const SNAKE_HP = 1, SNAKE_MAX = 30, SNAKE_STEP = .5;
  const SNAKE_FOOD_MAX = 3, SNAKE_FOOD_INTERVAL = 1.8, SNAKE_ROCKET_GAP = 3.4;
  const SNAKE_SKINS = ['normal','bonus','blast','tough','slow','multi'];
  function initSnake(){
    const mid = Math.floor(rows / 2);
    snake = {cells:[], moveT:SNAKE_STEP, foodT:SNAKE_FOOD_INTERVAL, rocketT:1.8};
    snakeFoods = []; snakeRockets = [];
    // 初始蛇身收在棋盘中央的窄区域，不再横贯整行堵住上下通道。
    // 三行 × 最多六列，保留一条有长度的蛇，同时给蛇头留下绕行空间。
    const snakeCols = Math.min(6, cols);
    const startCol = Math.floor((cols - snakeCols) / 2);
    const len = Math.min(SNAKE_MAX, snakeCols * 3), path = [];
    for(let band = 0; band < 3 && path.length < len; band++){
      const rr = mid - band;
      if(rr < 0) break;
      if(band % 2 === 0){
        for(let c=startCol+snakeCols-1;c>=startCol && path.length<len;c--) path.push({r:rr,c});
      } else {
        for(let c=startCol;c<startCol+snakeCols && path.length<len;c++) path.push({r:rr,c});
      }
    }
    for(let i = 0; i < len; i++)
      snake.cells.push({r:path[i].r, c:path[i].c,
                        type:SNAKE_SKINS[i % SNAKE_SKINS.length], hp:SNAKE_HP});
    // path 从右往左生成，cells[0] 就是蛇头，最后一项是尾
    syncSnakeBricks();
    spawnSnakeFood();
  }
  function syncSnakeBricks(){
    const old = bricks, next = snake.cells.map((cell, i) => {
      const b = cell.entity && cell.entity.alive
        ? cell.entity : new GameEntity('brick', {flash:0, dive:null, respawn:0, seed:Math.random()*6.28});
      cell.entity = b; // 实体身份跟随蛇节对象，而不是跟随数组下标。
      b.r=cell.r; b.c=cell.c; b.type=cell.type; b.hp=cell.hp;
      b.snakeIdx=i; b.boss=false; b.flash=Math.max(0,b.flash||0);
      return b;
    });
    const retained = new Set(next);
    for(const b of old) if(b && b.alive && !retained.has(b)) b.retire();
    bricks = next;
    layoutBricks();
  }
  function spawnSnakeFood(){
    if(!snake || snakeFoods.length >= SNAKE_FOOD_MAX) return;
    const occupied = new Set(snake.cells.map(c => c.r + ',' + c.c));
    for(const f of snakeFoods) occupied.add(f.r + ',' + f.c);
    const free = [];
    for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++)
      if(!occupied.has(r + ',' + c)) free.push({r,c});
    if(free.length) snakeFoods.push(free[Math.floor(Math.random()*free.length)]);

  function hitSnakeSegment(b, q){
    const hitIndex = b.snakeIdx;
    if(!snake || hitIndex < 0 || hitIndex >= snake.cells.length) return;
    const hitCell = snake.cells[hitIndex];
    // 身体尚未清空时，蛇头免疫；只剩蛇头后，命中头部才完成击杀。
    if(hitIndex === 0 && snake.cells.length > 1){
      b.flash = .65;
      beep(170, .045, 'sine', .025);
      floaters.push({x:q.x + q.w/2, y:q.y, text:'先清身体，再爆头', t:.8, life:.8, color:'#ffd27f', size:12});
      return;
    }
    hitCell.hp = 0; b.hp = 0; b.flash = 1;
    addScore(20 + (level - 1) * 2);
    spawnParticles(q.x + q.w/2, q.y + q.h/2, brickPalette(b).a, 8);
    beep(440, .06, 'square', .05);

    // 身体段被击中后消除，后半段向前收一格；只剩蛇头时才允许爆头击杀。
    const oldPositions = snake.cells.map(cell => ({r:cell.r, c:cell.c}));
    snake.cells.splice(hitIndex, 1);
    for(let i = hitIndex; i < snake.cells.length; i++){
      snake.cells[i].r = oldPositions[i].r;
      snake.cells[i].c = oldPositions[i].c;
    }
    floaters.push({x:q.x + q.w/2, y:q.y, text:'蛇身 −1', t:.9, life:.9, color:'#8ff2a8', size:13});
    syncSnakeBricks(); // 空蛇也要经过同步，确保最后一节实体正式退役。
    checkClear();
  }
  function updateSnake(dt){
    if(!snake || state !== 'playing') return;
    if(snakeFoods.length < SNAKE_FOOD_MAX){ snake.foodT -= dt; if(snake.foodT <= 0){ spawnSnakeFood(); snake.foodT = SNAKE_FOOD_INTERVAL; } }
    snake.rocketT -= dt;
    if(snake.rocketT <= 0 && snake.cells.length){
      const h = snake.cells[0], hb = bricks.find(b => b.snakeIdx === 0);
      if(hb){ const q=brickRect(hb); snakeRockets.push(new GameEntity('snake-rocket',{x:q.x+q.w/2,y:q.y+q.h+3,vy:Math.max(260,H*.62),r:5,trail:[]})); }
      snake.rocketT = SNAKE_ROCKET_GAP + Math.random()*1.2;
    }
    snake.moveT -= dt;
    if(snake.moveT > 0) return;
    snake.moveT = SNAKE_STEP;
    const head = snake.cells[0], cand = [];
    for(const d of [{r:0,c:1},{r:0,c:-1},{r:1,c:0},{r:-1,c:0}]){
      const r = head.r + d.r, c = head.c + d.c;
      if(r < 0 || r >= rows || c < 0 || c >= cols) continue;
      if(snake.cells.some(x => x.r === r && x.c === c)) continue;
      cand.push({r, c});
    }
    if(!cand.length){ snake.cells.reverse(); syncSnakeBricks(); return; }   // 掉头后同步实体索引与身份
    if(snakeFoods.length){
      const target = snakeFoods.reduce((best,f) => {
        const d = Math.abs(head.r-f.r)+Math.abs(head.c-f.c);
        return !best || d < best.d ? {food:f,d} : best;
      }, null).food;
      cand.sort((a,z) => (Math.abs(a.r-target.r)+Math.abs(a.c-target.c))
                       - (Math.abs(z.r-target.r)+Math.abs(z.c-target.c)));

    const pick = cand[0];
    snake.cells.unshift({r:pick.r, c:pick.c,
      type:SNAKE_SKINS[snake.cells.length % SNAKE_SKINS.length], hp:SNAKE_HP});
    const foodIndex = snakeFoods.findIndex(f => f.r === pick.r && f.c === pick.c);
    const ate = foodIndex >= 0;
    const grow = ate && snake.cells.length < SNAKE_MAX;
    if(ate){
      snakeFoods.splice(foodIndex,1); snake.foodT = SNAKE_FOOD_INTERVAL;
      addScore(50);
      floaters.push({x:W/2, y:topInset+area*.3, text:'🐍 进食 +50', t:.9, life:.9, color:'#8ff2a8', size:13});
      beep(620, .1, 'triangle', .05);
    }
    if(!grow) snake.cells.pop();

  }
  function snakeCellCenter(cell){
    return boardRuler(rows).center(cell.r, cell.c);
  }
  function drawSnakeFood(){
    if(!snakeFoods.length) return;
    for(let i=0;i<snakeFoods.length;i++){
      const p=snakeCellCenter(snakeFoods[i]), R=p.size*.23*(.85+.15*Math.sin(time*7+i));
      ctx.save(); ctx.shadowColor='#ffe38a'; ctx.shadowBlur=14;
      const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,R);
      g.addColorStop(0,'#fff8d0'); g.addColorStop(1,'#ff9a3c');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,6.283); ctx.fill(); ctx.restore();
    }
  }
  // 火箭不参与砖块碰撞，直接穿过蛇身；抵达挡板高度时造成一次危险命中。
  function updateSnakeRockets(dt){
    for(let i=snakeRockets.length-1;i>=0;i--){
      const r=snakeRockets[i], prevY=r.y;
      r.y+=r.vy*dt; r.trail.push({x:r.x,y:r.y});
      if(r.trail.length>7) r.trail.shift();
      // 火箭高速上升时按前后位置扫过挡板平面，不能只检查帧末坐标，否则可能穿板。
      const crossedPaddle = r.vy > 0 && prevY + r.r <= paddle.y && r.y + r.r >= paddle.y;
      const insidePaddle = r.y + r.r >= paddle.y && r.y - r.r <= paddle.y + paddle.h;
      const overlapX = r.x >= paddle.x - 5 && r.x <= paddle.x + paddle.w + 5;
      if(overlapX && (crossedPaddle || insidePaddle)){
        r.retire(); snakeRockets.splice(i,1); hitByHazard({x:r.x,y:r.y},'蛇头火箭');
        // 最后一颗心会触发 resetGame() 并清空火箭数组；必须退出旧数组的倒序遍历。
        if(state !== 'playing' || !snakeRockets.length) break;

  function drawSnakeRockets(){

      ctx.fillStyle='#ffb36b'; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(4,4); ctx.lineTo(0,2); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff0c2'; ctx.fillRect(-1,2,2,5); ctx.restore();
    }

  /* ---------- 小蜜蜂：击落位置自动补位（原版下一波补满） ---------- */
  function updateRespawns(dt){
    if(!isDiveLevel()) return;
    for(let i = respawnQueue.length - 1; i >= 0; i--){
      const q = respawnQueue[i];
      q.t -= dt;
      if(q.t > 0) continue;
      respawnQueue.splice(i, 1);
      if(bricks.some(b => b.alive && b.r === q.r && b.c === q.c)) continue;
      const nb = new GameEntity('brick', {r:q.r, c:q.c, alive:true, hp:q.boss?3:2, type:'normal', boss:q.boss,
                  flash:0, dive:null, respawn:.65, seed:Math.random()*6.28});
      bricks.push(nb);

  /* ---------- 编队俯冲关（Galaga 精华） ---------- */
  // 敌机从编队底部离队 → 锁定挡板画预警线 → 划弧俯冲 → 砸中扣心 / 飞出后归队
  function launchDiver(){
    const limit = level >= 30 ? 4 : 3;
    if(divers.length >= limit) return;
    const pool = bricks.filter(b => b.alive && !b.dive && b.respawn <= 0);
    if(!pool.length) return;
    // 像 Galaga 一样多从编队下缘起飞；擦伤过的优先再冲，方便补刀[citation:1][citation:2]
    pool.sort((a, z) => (z.wounded?1:0)-(a.wounded?1:0) || z.r - a.r || Math.random() - .5);
    const b = pool[Math.floor(Math.random() * Math.min(10, pool.length))];
    const q = brickRect(b);
    const aim = paddle.x + paddle.w / 2;
    const d = new GameEntity('galaga-diver', {
      alive:true, b, x:q.x + q.w / 2, y:q.y + q.h / 2, py:q.y + q.h / 2,
      w:q.w, h:q.h,
      vx:(Math.random() - .5) * 190 + (aim - (q.x + q.w / 2)) * .2,
      vy:110, targetX:aim, phase:'warn', t:0, rot:0, passed:false,
      trail:[], seed:b.seed, pal:brickPalette(b)
    });
    b.dive = d;
    divers.push(d);
    beep(720, .08, 'sawtooth', .03);
  }
  function recallDiver(d, hit){
    const k = divers.indexOf(d);
    if(k >= 0) divers.splice(k, 1);
    d.retire();
    if(d.b){ d.b.dive = null; d.b.respawn = .65; }   // 回到编队原位，短暂淡入
    if(hit) hitByHazard(d, '俯冲');
  }
  function recallAllDivers(){
    for(const d of divers.slice()){ d.retire(); if(d.b){ d.b.dive = null; d.b.respawn = .4; } }
    divers.length = 0;
  }
  function updateDivers(dt){
    for(const b of bricks) if(b.respawn > 0) b.respawn = Math.max(0, b.respawn - dt);
    for(let i = divers.length - 1; i >= 0; i--){
      const d = divers[i];
      if(!d || !d.alive) continue;           // 防止已退役实体继续更新
      d.t += dt;
      if(d.phase === 'warn'){
        // 预警期仍跟着编队摆动，闪红 + 一条指向挡板的锁定线，给玩家反应时间
        d.x = d.b.x + formationSway + d.b.w / 2;
        d.y = d.b.y + d.b.h / 2;
        if(d.t >= .45){ d.phase = 'dive'; d.t = 0; beep(400, .12, 'sawtooth', .045); }
        continue;
      }
      d.py = d.y;
      d.vy += 560 * dt;                     // 俯冲加速（放缓：给球更多拦截窗口）
      // 原版俯冲是完整冲到底再回位：持续追踪挡板直到接近挡板平面才锁死，
      // 保证不会「还没碰到挡板就半路飘走归队」，末段仍留出横移躲避窗口[citation:2]
      const aimNow = paddle.x + paddle.w / 2;
      if(d.y < paddle.y - H * .40) d.targetX = aimNow;   // 进入下 40% 屏高就锁死
      if(d.t < 1.2) d.vx += (d.targetX - d.x) * 1.0 * dt;
      if(d.x < 12 || d.x > W - 12) d.vx += (W / 2 - d.x) * .8 * dt;
      d.vx = clamp(d.vx, -520, 520);
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.rot = clamp(d.vx / 430, -1, 1) * .5;
      d.trail.push({x:d.x, y:d.y - d.h * .5});
      if(d.trail.length > 11) d.trail.shift();

      const hitRect = diverRect(d), halfH = hitRect.h / 2;
      const tt = clamp((d.x - paddle.x) / paddle.w, 0, 1);
      const sy = surfaceY(tt);
      const overlapX = hitRect.x + hitRect.w >= paddle.x && hitRect.x <= paddle.x + paddle.w;
      const crossed = d.py + hitRect.h / 2 <= sy + 6 && hitRect.y + hitRect.h >= sy - 2;
      const inside = hitRect.y + hitRect.h >= sy && hitRect.y <= paddle.y + paddle.h + 6;
      if(d.y + halfH >= paddle.y - 12) d.passed = true;
      if(overlapX && (crossed || inside)){
        recallDiver(d, true);
        if(!divers.length) break;          // 可能已重开
        continue;
      }
      // 只有完整冲过挡板平面、飞出屏幕后才归队；绝不半途折返
      if(d.passed && d.y - halfH > H + 26) recallDiver(d, false);
    }
  }
  function drawGalagaSprite(b, cx, cy, size, pulse){
    const boss = !!b.boss || b.r === 0;
    const butterfly = !boss && b.r <= Math.max(1, Math.ceil(rows * .38));
    const palette = boss
      ? {A:'#39e7cf',B:'#1686b9',C:'#ffe66b',D:'#f7fff2'}
      : butterfly
        ? {A:'#ff4b58',B:'#a71946',C:'#55d8ff',D:'#fff0dc'}
        : {A:'#35bfff',B:'#1762c8',C:'#ffe34f',D:'#fff7c2'};

      ? [
        ['...A...A.','..AAA.AAA.','.AACCACCA.','AACCCACCCA','AABCCACBBA','.AABBBBAA.','..ABBBBA..','...A.A....','..A...A...'],
        ['..A.....A.','..AAA.AAA.','.AACCACCA.','AACCCACCCA','AABCCACBBA','.AABBBBAA.','..ABBBBA..','...A.A....','..A...A...']
      ]
      : butterfly
        ? [
          ['A..A...A..','AA.AAA.AA..','.AAACCCAA.','..AACCCAA..','.AABDDDBAA.','AABBBBBBBA','..AABBBBA..','...A...A...','..A.....A..'],
          ['..AA...AA..','A.AAAAA.A.','.AAACCCAA.','..AACCCAA..','.AABDDDBAA.','AABBBBBBBA','..AABBBBA..','...A...A...','..A.....A..']
        ]
        : [
          ['..A.....A..','.AA.AAA.AA.','A.AACCCAA.A','..AACCCAA..','..AABDDDA..','.AABBBBBBA.','..AABBBBA..','...A...A...','..A.....A..'],
          ['A.........A','.AA.AAA.AA.','A.AACCCAA.A','..AACCCAA..','..AABDDDA..','.AABBBBBBA.','..AABBBBA..','...A...A...','..A.....A..']
        ];
    const frame = frames[Math.floor(time * 5 + (b.seed || 0)) % 2];
    const unit = size / 11, w = 11 * unit, h = 9 * unit;
    ctx.save();
    ctx.shadowColor = boss ? '#48ffe0' : butterfly ? '#ff526f' : '#42cfff';
    ctx.shadowBlur = 5 + pulse * 5;
    for(let y=0;y<frame.length;y++){
      const line = frame[y].padEnd(11,'.');
      for(let x=0;x<11;x++){
        const ch=line[x];

        ctx.fillStyle=palette[ch];
        ctx.fillRect(cx-w/2+x*unit,cy-h/2+y*unit,unit*.94,unit*.94);
      }
    }
    ctx.restore();
  }

  function drawDivers(){
    for(const d of divers){
      if(!d) continue;
      const hw = d.w / 2, hh = d.h / 2;
      if(d.phase === 'warn'){
        // 锁定线：从敌机指向挡板当前位置
