  // 击碎一块砖：金砖加分、爆炸砖连锁波及周围 8 格（可继续引爆别的爆炸砖）
  function shatter(seed, seedRect){
    let gained = 0, blasts = 0;
    const effects = [];
    const q = [seed], seen = new Set();
    let guard = 0;
    while(q.length && guard++ < 80){
      const b = q.shift();
      if(!b || !b.alive || seen.has(b)) continue;
      seen.add(b);
      // 爆炸波及的硬砖只削一层，削穿才碎
      if(b.type === 'tough' && b !== seed){
        b.hp -= dmgScale; b.flash = 1;
        if(b.hp > 0) continue;
      }
      const rect = (b === seed && seedRect) ? seedRect : brickRect(b);
      if(b.dive){                       // 连锁炸掉正在俯冲的敌机，顺手撤销这次俯冲
        const k = divers.indexOf(b.dive);
        if(k >= 0) divers.splice(k, 1);
        b.dive.retire();
        b.dive = null;
      }
      b.retire();
      const pal = brickPalette(b);
      gained += 10 + (level - 1) * 2;
      spawnParticles(rect.x + rect.w / 2, rect.y + rect.h / 2, pal.a, 7);
      if(b.type === 'bonus'){
        gained += 50;
        floaters.push({x:rect.x + rect.w/2, y:rect.y, text:'+50', t:.85, life:.85, color:'#ffe38a', size:14});
        if(isTrapLevel()){
          addLives(1);
          floaters.push({x:rect.x + rect.w/2, y:rect.y - 12, text:'+1 ♥', t:1, life:1, color:'#ffe38a', size:13});
        }
      }
      if(b.type !== 'trap' && ['slow','multi','bleed','drunk','spin','half','gravity'].indexOf(b.type) >= 0)
        effects.push({b, rect});
      if(b.type === 'blast'){
        blasts++;
        waves.push({x:rect.x + rect.w/2, y:rect.y + rect.h/2, r0:5, max:Math.max(58, b.w * 1.9),
                    t:.46, life:.46, color:'#ff9a5c'});
        shake = Math.max(shake, 7);
        for(const n of bricks){
          if(n.alive && n !== b && Math.abs(n.r - b.r) <= 1 && Math.abs(n.c - b.c) <= 1) q.push(n);
        }
      }
    }
    addScore(gained);                 // 连锁一次性结算，补心阈值也照常生效
    for(const e of effects) triggerEffect(e.b, e.rect);
    if(blasts) beep(150 + Math.min(blasts, 5) * 35, .16, 'sawtooth', .05);
    return blasts;
  }
  function colorOf(b){
    if(level === 1 && levelType() === LT.CLASSIC){
      const hue = 280 - (clamp(b.r, 0, Math.max(1, rows - 1)) / Math.max(1, rows - 1)) * 280;
      return 'hsl(' + hue + ',90%,62%)';
    }
    return 'hsl(' + (196 + b.r / Math.max(1, rowCount) * 132) + ',88%,62%)';
  }

  /* ---------- 绘制 ---------- */
  function roundRect(x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  function draw(){
    ctx.save();
    if(shake > .1) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    // 背景：整屏铺满（多留 20px，震动时不露边）
    const firstLevelStyle = level === 1;
    const showFirstLevelIntro = firstLevelStyle && firstLevelIntroT > 0;
    const g = ctx.createLinearGradient(0, 0, W * .3, H);
    if(firstLevelStyle){
      g.addColorStop(0, '#100d32'); g.addColorStop(.42, '#17245a'); g.addColorStop(1, '#080b20');
    } else {
      g.addColorStop(0, '#080e20'); g.addColorStop(.55, '#0b1430'); g.addColorStop(1, '#0a0a1e');
    }
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    if(firstLevelStyle){
      const nebula = ctx.createRadialGradient(W*.5, topInset+area*.42, 8, W*.5, topInset+area*.42, W*.78);
      nebula.addColorStop(0, 'rgba(130,90,255,.20)');
      nebula.addColorStop(.48, 'rgba(60,125,255,.10)');
      nebula.addColorStop(1, 'rgba(30,50,120,0)');
      ctx.fillStyle = nebula; ctx.fillRect(0, 0, W, H);
    }

    const glow = ctx.createRadialGradient(paddle.x + paddle.w / 2, paddle.y, 10, paddle.x + paddle.w / 2, paddle.y, Math.max(W, H) * .62);
    glow.addColorStop(0, 'rgba(80,130,255,.16)'); glow.addColorStop(1, 'rgba(80,130,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // 缓慢流动网格 + 星点，填充球运动区
    const grid = 46, off = (time * 9) % grid;
    ctx.strokeStyle = firstLevelStyle ? 'rgba(150,185,255,.025)' : 'rgba(130,170,255,.045)'; ctx.lineWidth = 1; ctx.beginPath();
    for(let x = -grid + off; x < W + grid; x += grid){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for(let y = -grid + off * .55; y < H + grid; y += grid){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    for(const s of stars){
      const a = s.a * (.6 + .4 * Math.sin(time * s.s * .25 + s.p));
      ctx.fillStyle = 'rgba(180,210,255,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }

    if(showFirstLevelIntro){
      // 第一关封面标题：作为星空背景中的品牌主视觉，不再像 HUD 标签一样占一条横栏。
      // 标题绘制在砖块之前，彩虹弧形经过时会自然叠在文字光效前方。
      ctx.save();
      // 最后 .9 秒平滑淡出，标题消失后不再占用游戏画面。
      ctx.globalAlpha = clamp(firstLevelIntroT / .9, 0, 1);
      const titleY = topInset + Math.max(27, Math.min(43, area * .105));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      // 柔和的椭圆星云托起标题，让字融入宇宙，而不是放进实体底框。
      const titleGlow = ctx.createRadialGradient(W*.5, titleY-8, 2, W*.5, titleY-8, W*.43);
      titleGlow.addColorStop(0, 'rgba(120,105,255,.19)');
      titleGlow.addColorStop(.55, 'rgba(95,115,255,.075)');
      titleGlow.addColorStop(1, 'rgba(80,110,255,0)');
      ctx.fillStyle = titleGlow;
      ctx.fillRect(W*.08, titleY-48, W*.84, 72);

      // 中文品牌名为主标题，采用珍珠白到淡金的渐变和克制的星光辉映。
      ctx.shadowColor = 'rgba(150,175,255,.78)';
      ctx.shadowBlur = 19;
      const cn = ctx.createLinearGradient(W*.35, titleY-27, W*.65, titleY);
      cn.addColorStop(0, '#ffffff');
      cn.addColorStop(.55, '#e8e7ff');
      cn.addColorStop(1, '#ffe6bd');
      ctx.fillStyle = cn;
      ctx.font = '900 ' + clamp(W*.078, 25, 33) + 'px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('彩虹星河', W*.5, titleY);

      // 英文作为品牌副标题，字距感通过两侧星点与细线营造。
      ctx.shadowColor = 'rgba(105,190,255,.7)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(205,225,255,.94)';
      ctx.font = '700 ' + clamp(W*.029, 10, 12) + 'px system-ui,-apple-system,sans-serif';
      ctx.fillText('R A I N B O W   G A L A X Y', W*.5, titleY+17);

      const lineY = titleY + 26;
      const line = ctx.createLinearGradient(W*.18,0,W*.82,0);
      line.addColorStop(0,'rgba(120,150,255,0)');
      line.addColorStop(.28,'rgba(135,190,255,.28)');
      line.addColorStop(.5,'rgba(225,225,255,.72)');
      line.addColorStop(.72,'rgba(255,155,220,.3)');
      line.addColorStop(1,'rgba(255,130,220,0)');
      ctx.shadowBlur = 7;
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W*.18,lineY); ctx.lineTo(W*.82,lineY); ctx.stroke();

      // 两颗微型星芒让标题有封面识别点，亮度轻微呼吸，不干扰游戏。
      const sparkle = .62 + .28 * Math.sin(time * 1.7);
      for(const x of [W*.22, W*.78]){
        ctx.globalAlpha = sparkle;
        ctx.fillStyle = '#d9eaff';
        ctx.shadowColor = '#9bdcff'; ctx.shadowBlur = 9;
        ctx.beginPath(); ctx.arc(x, titleY-9, 1.7, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x-4,titleY-9); ctx.lineTo(x+4,titleY-9);
        ctx.moveTo(x,titleY-13); ctx.lineTo(x,titleY-5); ctx.stroke();
      }
      ctx.restore();
    }

    // 高速反馈不再扫过屏幕边缘：只在球附近增加柔和、稳定的暖色光晕。
    const furyBg = clamp((liveMult() - 1) / (FURY_REF - 1), 0, 1);
    if(furyBg > .2){
      ctx.save();
      const auraR = ball.r * (3.2 + furyBg * 2.4);
      const aura = ctx.createRadialGradient(ball.x,ball.y,ball.r,ball.x,ball.y,auraR);
      aura.addColorStop(0,'rgba(255,190,125,' + (.08 + furyBg*.10).toFixed(3) + ')');
      aura.addColorStop(.55,'rgba(255,125,105,' + (.035 + furyBg*.045).toFixed(3) + ')');
      aura.addColorStop(1,'rgba(255,100,130,0)');
      ctx.fillStyle = aura;
      ctx.fillRect(ball.x-auraR,ball.y-auraR,auraR*2,auraR*2);
      ctx.restore();
    }

    // 弹珠台机关绘制。
    if(isCurseLevel()){
      for(const h of plinkoPockets){
        ctx.save(); ctx.shadowColor='#ff4778'; ctx.shadowBlur=18;
        const pg=ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,h.r*1.5);
        pg.addColorStop(0,'#020513'); pg.addColorStop(.68,'#10152e'); pg.addColorStop(1,'rgba(255,65,115,.18)');
        ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*1.35,0,6.283); ctx.fill();
        ctx.strokeStyle='rgba(255,105,145,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,6.283); ctx.stroke();
        ctx.fillStyle='#ff9ab4'; ctx.font='700 9px system-ui'; ctx.textAlign='center'; ctx.fillText('−♥',h.x,h.y+3); ctx.restore();
      }
      for(const p of plinkoBumpers){
        ctx.save(); ctx.shadowColor='#45dfff'; ctx.shadowBlur=20;
        const bg=ctx.createRadialGradient(p.x-p.r*.3,p.y-p.r*.35,2,p.x,p.y,p.r);
        bg.addColorStop(0,'#f4ffff'); bg.addColorStop(.35,'#7cf3ff'); bg.addColorStop(1,'#2474c8');
        ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
        ctx.strokeStyle='rgba(220,255,255,.9)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*.58,0,6.283); ctx.stroke(); ctx.restore();
      }
      ctx.save(); ctx.fillStyle='#9fefff'; ctx.font='700 12px system-ui'; ctx.textAlign='center';
      ctx.fillText('目标砖 '+bricks.filter(b => b.alive).length+' 块 · 清空通关',W/2,topInset+25); ctx.restore();
    }

    // 第三关双层铁墙：上墙两个固定缺口，下墙通道持续左右匀速移动。
    if(isFortressLevel()){
      const walls = fortressWallYs();
      const drawWall = (y, openings, moving) => {
        ctx.save(); ctx.lineCap='round'; ctx.lineWidth=7;
        ctx.shadowColor=moving?'#ffbd72':'#63dfff'; ctx.shadowBlur=12;
        ctx.strokeStyle='rgba(105,145,205,.9)';
        ctx.beginPath(); ctx.moveTo(3,y); ctx.lineTo(W-3,y); ctx.stroke();
        const halfOpening = moving ? W*.14 : W*.055;
        ctx.globalCompositeOperation='destination-out';
        for(const x of openings){
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y);
          ctx.lineWidth=halfOpening*2; ctx.stroke();
        }
        ctx.globalCompositeOperation='source-over';
        ctx.strokeStyle=moving?'#ffc477':'#8cecff'; ctx.lineWidth=2;
        for(const x of openings){
          for(const side of [-1,1]){
            ctx.beginPath(); ctx.moveTo(x+side*halfOpening,y-5);
            ctx.lineTo(x+side*halfOpening,y+5); ctx.stroke();
          }
        }
        ctx.restore();
      };
      drawWall(walls.upper,[W*.33,W*.67],false);
      drawWall(walls.lower,[fortressGateX],true);
      ctx.save(); ctx.fillStyle='#9fefff'; ctx.font='700 10px system-ui'; ctx.textAlign='center';
      ctx.fillText('固定双缺口',W*.5,walls.upper-10);
      ctx.fillStyle='#ffd49a'; ctx.fillText('移动通道  ⇆',fortressGateX,walls.lower-12); ctx.restore();
    }


    // 球区分界线 + 缓慢上移的流光，长屏下半部也有层次
    const zoneTop = topInset + area, zoneH = Math.max(60, paddle.y - zoneTop);
    ctx.save();
    ctx.strokeStyle = 'rgba(130,180,255,.12)'; ctx.lineWidth = 1; ctx.setLineDash([3, 9]);
    ctx.beginPath(); ctx.moveTo(0, zoneTop + 12); ctx.lineTo(W, zoneTop + 12); ctx.stroke();
    ctx.setLineDash([]);
    const bandY = zoneTop + 30 + ((time * 26) % Math.max(1, zoneH - 60));
    const band = ctx.createLinearGradient(0, bandY - 70, 0, bandY + 70);
    band.addColorStop(0, 'rgba(90,150,255,0)');
    band.addColorStop(.5, 'rgba(90,150,255,.06)');
    band.addColorStop(1, 'rgba(90,150,255,0)');
    ctx.fillStyle = band; ctx.fillRect(0, bandY - 70, W, 140);
    ctx.restore();

    // Galaga 风格敌机：原创像素精灵，按编队行数区分 Boss、蝴蝶与蜜蜂


    // 砖块：每种类型有自己的图案，整体还会轻微呼吸发光
    for(const b of bricks){
      if(!b.alive) continue;
      if(b.dive && b.dive.phase !== 'warn') continue;   // 离队俯冲的由 drawDivers 画
      const q = brickRect(b);
      ctx.save();
      ctx.translate(q.x - b.x, q.y - b.y);       // 编队摆动 / 俯冲位移，内部绘制代码不用改
      if(b.respawn > 0) ctx.globalAlpha = 1 - b.respawn / .65 * .72;
      const pal = brickPalette(b);
      const pulse = .5 + .5 * Math.sin(time * 2.2 + b.r * .8 + b.c * .5 + b.seed);
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2, s = Math.min(b.w, b.h);
      if(isDiveLevel() && b.type === 'normal'){
        drawGalagaSprite(b, cx, cy, s * .94, pulse);
      } else {
        ctx.save();
        ctx.shadowColor = pal.glow;
        ctx.shadowBlur = 6 + pulse * 5 + (b.type === 'blast' ? 7 * pulse : 0);
        const bg = ctx.createLinearGradient(b.x, b.y, b.x + b.w * .4, b.y + b.h);
        bg.addColorStop(0, pal.a); bg.addColorStop(1, pal.b);
        ctx.fillStyle = bg;
        roundRect(b.x, b.y, b.w, b.h, Math.min(5, b.h * .22)); ctx.fill();
        ctx.restore();
        // 顶部高光 + 底部暗边，让砖块有厚度
        const hh = Math.max(2, b.h * .16);
        ctx.fillStyle = 'rgba(255,255,255,.26)';
        roundRect(b.x + 2, b.y + 2, b.w - 4, hh, 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.16)';
        roundRect(b.x + 2, b.y + b.h - hh - 1, b.w - 4, hh, 2); ctx.fill();
        if(level === 1){
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,.52)';
          ctx.lineWidth = .9;
          roundRect(b.x + .7, b.y + .7, b.w - 1.4, b.h - 1.4, Math.min(5,b.h*.3));
          ctx.stroke();
          ctx.restore();
        }
      }

      if(b.type === 'bonus'){                     // 旋转的四角星
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(time * 1.2 + b.seed);
        ctx.fillStyle = 'rgba(255,255,255,.94)';
        ctx.shadowColor = '#fff2b0'; ctx.shadowBlur = 8;
        const R = s * .3, ri = s * .11;
        ctx.beginPath();
        for(let k = 0; k < 8; k++){
          const a = k * Math.PI / 4, rr = k % 2 === 0 ? R : ri;
          k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr)
            : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else if(b.type === 'blast'){             // 同心圆 + 准星，脉冲放大
        ctx.save();
        ctx.strokeStyle = 'rgba(255,240,220,.9)'; ctx.lineWidth = 1.4;
        ctx.shadowColor = '#ff8a4c'; ctx.shadowBlur = 6;
        const rr = s * (.19 + .05 * pulse);
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.283); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, rr * .48, 0, 6.283); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - s * .3, cy); ctx.lineTo(cx + s * .3, cy);
        ctx.moveTo(cx, cy - s * .3); ctx.lineTo(cx, cy + s * .3);
        ctx.stroke(); ctx.restore();
      } else if(b.type === 'tough'){             // 双层描边 + 裂纹（打过一次更深）
        ctx.save();
        ctx.strokeStyle = b.hp > 1 ? 'rgba(255,255,255,.62)' : 'rgba(24,38,76,.78)';
        ctx.lineWidth = b.hp > 1 ? 1.4 : 2;
        roundRect(b.x + 2.5, b.y + 2.5, b.w - 5, b.h - 5, 4); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * .28, b.y + 2);
        ctx.lineTo(b.x + b.w * .46, b.y + b.h * .5);
        ctx.lineTo(b.x + b.w * .32, b.y + b.h - 2);
        ctx.moveTo(b.x + b.w * .70, b.y + 2);
        ctx.lineTo(b.x + b.w * .58, b.y + b.h * .52);
        ctx.lineTo(b.x + b.w * .74, b.y + b.h - 2);
        ctx.stroke(); ctx.restore();
      } else if(b.type === 'slow'){             // 六向雪花，缓慢自转
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(time * .5 + b.seed);
        ctx.strokeStyle = 'rgba(240,255,252,.95)'; ctx.lineWidth = 1.5;
        ctx.lineCap = 'round'; ctx.shadowColor = '#8ff2dd'; ctx.shadowBlur = 7;
        const R = s * .3;
        for(let k = 0; k < 3; k++){
          const a = k * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(-Math.cos(a) * R, -Math.sin(a) * R);
          ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); ctx.stroke();
          for(const sg of [-1, 1]){
            const bx = Math.cos(a) * R * .62 * sg, by = Math.sin(a) * R * .62 * sg;
            ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx - Math.cos(a - .7) * R * .28, by - Math.sin(a - .7) * R * .28);
            ctx.moveTo(bx, by);
            ctx.lineTo(bx - Math.cos(a + .7) * R * .28, by - Math.sin(a + .7) * R * .28);
            ctx.stroke();
          }
        }
        ctx.restore();
      } else if(b.type === 'multi'){            // 品字三球，轻微跳动
        ctx.save();
        ctx.fillStyle = 'rgba(248,235,255,.95)';
        ctx.shadowColor = '#dcb0ff'; ctx.shadowBlur = 8;
        const rr = s * .105, hop = Math.sin(time * 3 + b.seed) * s * .045;
        const pts = [[0, -s * .17 + hop], [-s * .19, s * .16], [s * .19, s * .16]];
        for(const q of pts){
          ctx.beginPath(); ctx.arc(cx + q[0], cy + q[1], rr, 0, 6.283); ctx.fill();
        }
        ctx.restore();
      } else if(b.type === 'trap'){             // 叉 + 环：踩中直接丢主球
        ctx.save(); ctx.strokeStyle='rgba(255,235,240,.95)'; ctx.lineWidth=2;
        ctx.shadowColor='#ff5c78'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(cx,cy,s*.27,0,6.283); ctx.stroke();
        const d=s*.15;
        ctx.beginPath(); ctx.moveTo(cx-d,cy-d); ctx.lineTo(cx+d,cy+d);
        ctx.moveTo(cx+d,cy-d); ctx.lineTo(cx-d,cy+d); ctx.stroke(); ctx.restore();
      } else if(b.type === 'bleed'){            // 血滴：开启持续失血倒计时
        ctx.save(); ctx.fillStyle='rgba(255,230,220,.95)';
        ctx.shadowColor='#ff7a52'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.moveTo(cx,cy-s*.3);
        ctx.bezierCurveTo(cx+s*.24,cy-s*.02,cx+s*.18,cy+s*.28,cx,cy+s*.28);
        ctx.bezierCurveTo(cx-s*.18,cy+s*.28,cx-s*.24,cy-s*.02,cx,cy-s*.3);
        ctx.fill(); ctx.restore();
      } else if(b.type === 'drunk'){            // 歪扭波浪：挡板打滑
        ctx.save(); ctx.strokeStyle='rgba(245,225,255,.95)'; ctx.lineWidth=1.8;
        ctx.shadowColor='#c48cff'; ctx.shadowBlur=7;
        for(let k=0;k<2;k++){ ctx.beginPath();
          for(let i=0;i<=12;i++){ const xx=cx-s*.3+i*s*.05;
            const yy=cy+(k?1:-1)*s*.1+Math.sin(i*.8+time*4+b.seed)*s*.07;
            i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
          ctx.stroke(); }
        ctx.restore();
      } else if(b.type === 'spin'){             // 螺旋：球路缓慢旋转
        ctx.save(); ctx.strokeStyle='rgba(225,245,255,.95)'; ctx.lineWidth=1.7;
        ctx.shadowColor='#6cc8ff'; ctx.shadowBlur=7; ctx.beginPath();
        for(let i=0;i<=28;i++){ const a=i*.42+time*2+b.seed, rr=s*.3*i/28;
          const xx=cx+Math.cos(a)*rr, yy=cy+Math.sin(a)*rr;
          i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
        ctx.stroke(); ctx.restore();
      } else if(b.type === 'half'){             // 半实心：伤害永久减半
        ctx.save(); ctx.fillStyle='rgba(235,235,248,.92)';
        ctx.shadowColor='#9a9ab8'; ctx.shadowBlur=6;
        ctx.fillRect(cx-s*.26,cy-s*.26,s*.26,s*.52);
        ctx.strokeStyle='rgba(235,235,248,.92)'; ctx.lineWidth=1.6;
        ctx.strokeRect(cx-s*.26,cy-s*.26,s*.52,s*.52); ctx.restore();
      } else if(b.type === 'gravity'){          // 向下箭头：额外重力
        ctx.save(); ctx.strokeStyle='rgba(255,240,210,.95)'; ctx.lineWidth=2;
        ctx.shadowColor='#ffb954'; ctx.shadowBlur=7;
        ctx.beginPath(); ctx.moveTo(cx,cy-s*.3); ctx.lineTo(cx,cy+s*.22);
        ctx.moveTo(cx-s*.16,cy+s*.06); ctx.lineTo(cx,cy+s*.26);
        ctx.lineTo(cx+s*.16,cy+s*.06); ctx.stroke(); ctx.restore();
      }
      if(isSnakeLevel() && snake){
        if(b.snakeIdx === 0){                 // 蛇头：两只眼睛
          ctx.save(); ctx.shadowColor='#8ff2a8'; ctx.shadowBlur=8;
          ctx.fillStyle='rgba(255,255,255,.96)';
          for(const dx of [-.13,.13]){ ctx.beginPath(); ctx.arc(cx+dx*s,cy-s*.05,s*.075,0,6.283); ctx.fill(); }
          ctx.fillStyle='#0b2a18';
          for(const dx of [-.13,.13]){ ctx.beginPath(); ctx.arc(cx+dx*s,cy-s*.05,s*.032,0,6.283); ctx.fill(); }
          ctx.restore();
        }

      }
      if(b.flash > 0){                          // 被击中的白闪
        ctx.fillStyle = 'rgba(255,255,255,' + (b.flash * .55).toFixed(3) + ')';
        roundRect(b.x, b.y, b.w, b.h, Math.min(5, b.h * .22)); ctx.fill();
      }
      if(b.dive && b.dive.phase === 'warn'){   // 起飞前闪红，提示「它锁定你了」
        ctx.save();
        ctx.globalAlpha = .45 + .5 * Math.abs(Math.sin(time * 14));
        ctx.strokeStyle = '#ff6ba8'; ctx.lineWidth = 2;
        ctx.shadowColor = '#ff6ba8'; ctx.shadowBlur = 10;
        roundRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4, 6); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    if(isDiveLevel()) drawDivers();            // 离队俯冲的敌机、锁定线、尾焰
    if(isSnakeLevel()){ drawSnakeFood(); drawSnakeRockets(); } // 贪吃蛇食物与穿身火箭

    // Auto 的瞄准：反向传播算出的目标砖 + 从接球点指向它的虚线
    if(autoPilot && state === 'playing' && aimPlan && aimPlan.brick && aimPlan.brick.alive){
      const b = aimPlan.brick, q = brickRect(b), tt = (aimPlan.rel + 1) / 2;
      ctx.save();
      ctx.globalAlpha = .3 + .12 * Math.sin(time * 4);
      ctx.strokeStyle = '#9ff8d4'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 7]);
      ctx.beginPath();
      const aimX=shape==='ring'?paddle.x+paddle.w/2+ringAimOffset(aimPlan.rel):paddle.x+tt*paddle.w;
      const aimY=shape==='ring'?ringAimContactY(aimPlan.rel,ball.r):surfaceY(tt);
      ctx.moveTo(aimX,aimY-3);
      ctx.lineTo(q.x + q.w / 2, q.y + q.h);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = .65 + .3 * Math.sin(time * 4);
      ctx.shadowColor = '#8ff2c8'; ctx.shadowBlur = 10;
      ctx.strokeStyle = '#b6ffe0'; ctx.lineWidth = 2;
      roundRect(q.x - 3, q.y - 3, q.w + 6, q.h + 6, 6); ctx.stroke();
      ctx.restore();
    }

    // 球越快越「烧」：拖尾、球体、辉光一起从冰蓝渐变到橙红
    const fury = clamp((liveMult() - 1) / (FURY_REF - 1), 0, 1);
    const tr = Math.round(140 + 115 * fury), tg = Math.round(225 - 105 * fury), tb = Math.round(255 - 185 * fury);
    const hotRGB = tr + ',' + tg + ',' + tb;
    // 圆环模式由表情包替代球体，隐藏主球拖尾；其他模式保留原拖尾。
    if(shape!=='ring'){
      for(let i = 0; i < trail.length; i++){
        const t = trail[i], a = (i + 1) / trail.length;
        const rad = ball.r * a * (.85 + .25 * fury);
        const nxt = trail[i + 1];
        const segs = nxt ? Math.min(10, Math.ceil(Math.hypot(nxt.x - t.x, nxt.y - t.y) / 7)) : 0;
        for(let k = 0; k <= segs; k++){
          const u = segs ? k / segs : 0;
          const x = nxt ? t.x + (nxt.x - t.x) * u : t.x;
          const y = nxt ? t.y + (nxt.y - t.y) * u : t.y;
          const aa = nxt ? a + u / trail.length : a;
          ctx.fillStyle = 'rgba(' + hotRGB + ',' + (aa * (.28 + .22 * fury)).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(x, y, Math.max(1, rad * (nxt ? .6 + .4 * u : 1)), 0, 6.283); ctx.fill();
        }
      }
    }
    // 球：多球时主球略放大并加一圈淡金光环，一眼认出「哪颗掉了才扣血」
    // 只改绘制尺寸，物理半径 ball.r 不变，避免碰撞口径不一致
    const mainDraw = extraBalls.length ? ball.r * 1.18 : ball.r;
    if(shape!=='ring'){
      if(extraBalls.length){
        ctx.save();
        ctx.strokeStyle = 'rgba(255,226,150,.8)'; ctx.lineWidth = 1.6;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.arc(ball.x, ball.y, mainDraw + 5 + Math.sin(time * 4) * 1.5, 0, 6.283); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
      ctx.save();
      ctx.shadowColor = 'rgb(' + hotRGB + ')'; ctx.shadowBlur = 18 + 16 * fury;
      const bg2 = ctx.createRadialGradient(ball.x - ball.r * .35, ball.y - ball.r * .4, .5, ball.x, ball.y, mainDraw);
      bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(1, 'rgb(' + hotRGB + ')');
      ctx.fillStyle = bg2; ctx.beginPath(); ctx.arc(ball.x, ball.y, mainDraw, 0, 6.283); ctx.fill();
      ctx.restore();
    } else {
      // 圆环模式：表情包就是球的可见外观；ball.x/y/r 和全部物理计算保持原样。
      const mx=ball.x, my=ball.y;
      const face=ringMood.face || '🤪';
      const alpha=ringMood.t>0 ? clamp(Math.min(1,ringMood.t/.22),0,1) : 1;
      const faceSize=clamp(ball.r*3.15,22,30);
      ctx.save();
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=alpha;
      ctx.font=faceSize+'px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#ffffff';
      ctx.shadowColor='rgba(0,0,0,.72)';
      ctx.shadowBlur=3;
      ctx.lineWidth=1.1;
      ctx.strokeStyle='rgba(8,18,38,.72)';
      ctx.strokeText(face,mx,my);
      ctx.fillText(face,mx,my);
      ctx.restore();
    }

    // 多球砖分裂出的额外球：紫色短拖尾，和主球一眼可区分
    for(const e of extraBalls){
      for(let i = 0; i < e.trail.length; i++){
        const q = e.trail[i], a = (i + 1) / e.trail.length;
        ctx.fillStyle = 'rgba(205,145,255,' + (a * .3).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(q.x, q.y, e.r * a * .8, 0, 6.283); ctx.fill();
      }
      ctx.save();
      ctx.shadowColor = '#cf92ff'; ctx.shadowBlur = 14;
      const eg = ctx.createRadialGradient(e.x - e.r * .3, e.y - e.r * .35, .5, e.x, e.y, e.r);
      eg.addColorStop(0, '#ffffff'); eg.addColorStop(1, '#c07cf0');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    drawFalling();   // 落砖关：自由落体的砖块

    // 挡板：三种形状共用同一套渐变与发光
    const px = paddle.x, pw = paddle.w, bottom = paddle.y + paddle.h, pcx = px + pw / 2;
    const h = shapeBodyH();
    const topY = shape === 'rect' ? paddle.y : bottom - h;
    ctx.save();
    ctx.shadowColor = '#7cc4ff'; ctx.shadowBlur = 16;
    const pg = ctx.createLinearGradient(0, topY, 0, bottom);
    pg.addColorStop(0, '#d8f4ff'); pg.addColorStop(.45, '#79c8ff'); pg.addColorStop(1, '#4b6ede');
    ctx.fillStyle = pg;
    ctx.beginPath();
    if(shape === 'triangle'){                 // 标准等边：底边 pw，高 √3/2·pw，三边等长
      ctx.moveTo(pcx, topY); ctx.lineTo(px + pw, bottom); ctx.lineTo(px, bottom); ctx.closePath();
    } else if(shape === 'semicircle'){        // 标准半圆：圆心在底边中点，半径 pw/2
      ctx.moveTo(px, bottom);
      ctx.arc(pcx, bottom, SEMI_R(), Math.PI, 2 * Math.PI);
      ctx.closePath();
    } else if(shape === 'moon'){              // 新月：外缘向下鼓起，内缘形成朝上的 U 形接球槽
      ctx.moveTo(px, topY);
      ctx.quadraticCurveTo(pcx, bottom + h, px + pw, topY);
      ctx.quadraticCurveTo(pcx, bottom + .44 * h, px, topY);
      ctx.closePath();
    } else if(shape === 'ring'){
      const R=RING_R(),gap=RING_GAP_HALF();
      const cy=bottom-R,start=-Math.PI/2+gap,end=3*Math.PI/2-gap;
      ctx.arc(pcx,cy,R,start,end,false);
      for(let i=64;i>=0;i--){
        const a=start+(end-start)*i/64,ri=ringInnerRadius(a);
        ctx.lineTo(pcx+ri*Math.cos(a),cy+ri*Math.sin(a));
      }
      ctx.closePath();
    } else {
      roundRect(px, paddle.y, pw, paddle.h, paddle.h / 2);
    }
    ctx.fill();
    ctx.restore();
    // 轮廓高光
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
    if(shape === 'rect'){
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      roundRect(px + pw * .3, paddle.y + 2, pw * .4, 2, 1); ctx.fill();
    } else if(shape === 'ring'){
      ctx.save(); ctx.strokeStyle='rgba(255,255,255,.72)'; ctx.lineWidth=1.5;
      ctx.beginPath();
      const cy=bottom-RING_R(),gap=RING_GAP_HALF(),a0=-Math.PI/2+gap,a1=3*Math.PI/2-gap;
      for(let i=0;i<=96;i++){
        const a=a0+(a1-a0)*i/96,ri=ringInnerRadius(a);
        if(i===0)ctx.moveTo(pcx+ri*Math.cos(a),cy+ri*Math.sin(a));
        else ctx.lineTo(pcx+ri*Math.cos(a),cy+ri*Math.sin(a));
      }
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(pcx, topY + 3, 2.2, 0, 6.283); ctx.fill();
    }
    if(autoPilot){
      ctx.save();
      ctx.globalAlpha = .5 + .18 * Math.sin(time * 2.6);
      ctx.fillStyle = '#7ff0c0';
      ctx.font = '700 9px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('AUTO', pcx, Math.min(H - 12, bottom + 5));
      ctx.restore();
    }

    // 粒子
    for(const p of particles){
      ctx.globalAlpha = clamp(p.life * 2.2, 0, 1);
      ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // 爆炸冲击波
    for(const w of waves){
      const k = 1 - w.t / w.life;
      ctx.save();
      ctx.globalAlpha = clamp(w.t / w.life, 0, 1) * .85;
      ctx.strokeStyle = w.color; ctx.lineWidth = 2 + k * 3;
      ctx.shadowColor = w.color; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r0 + k * w.max, 0, 6.283); ctx.stroke();
      ctx.restore();
    }
    // 加分 / 新砖种飘字
    for(const f of floaters){
      const k = clamp(f.t / f.life, 0, 1), y = f.y - (1 - k) * 22;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 2.2);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + f.size + 'px system-ui,sans-serif';
      if(f.hint){
        const tw = ctx.measureText(f.text).width;
        ctx.fillStyle = 'rgba(8,14,32,.84)';
        roundRect(f.x - tw/2 - 12, y - f.size/2 - 7, tw + 24, f.size + 14, 11);
        ctx.fill();
        ctx.strokeStyle = 'rgba(150,190,255,.3)'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.fillStyle = f.color; ctx.shadowColor = f.color; ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, y);
      ctx.restore();
    }

    // 接球方向指示：一道短箭头，直观看到挡板把球「打歪」了多少
    if(hitFx){
      const k = clamp(hitFx.t / .38, 0, 1);
      const len = 32 + (1 - k) * 26;
      const hy = hitFx.y - ball.r;
      const dx = Math.sin(hitFx.ang) * len, dy = -Math.abs(Math.cos(hitFx.ang)) * len;
      const col = Math.abs(hitFx.ang) > .55 ? '#ffd27f' : '#8ee6ff';
      ctx.save();
      ctx.globalAlpha = k;
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(hitFx.x, hy); ctx.lineTo(hitFx.x + dx, hy + dy); ctx.stroke();
      const a = Math.atan2(dy, dx), ah = 8;
      ctx.beginPath();
      ctx.moveTo(hitFx.x + dx, hy + dy);
      ctx.lineTo(hitFx.x + dx - ah * Math.cos(a - .5), hy + dy - ah * Math.sin(a - .5));
      ctx.moveTo(hitFx.x + dx, hy + dy);
      ctx.lineTo(hitFx.x + dx - ah * Math.cos(a + .5), hy + dy - ah * Math.sin(a + .5));
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hitFx.x, hy, 1 + 3 * k, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    // 临时提示固定显示在挡板下方，避免占用右上角工具栏和主要游戏区域。
    if(toast){
      ctx.save();
      ctx.globalAlpha = clamp(toast.t, 0, 1);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + Math.round(clamp(W * .032, 12, 15)) + 'px system-ui,sans-serif';
      ctx.fillStyle = '#bfe6ff'; ctx.shadowColor = '#3d7fff'; ctx.shadowBlur = 10;
      const hintY = Math.min(H - 16, paddle.y + paddle.h + 17);
      ctx.fillText(toast.text, W / 2, hintY, W - 28);
      ctx.restore();
    }

    // 待发球：只在球上画一圈呼吸光，不用任何文字或窗口
    if(state === 'serving'){
      ctx.save();
      const pulse = Math.sin(time * 3.2);
      ctx.strokeStyle = 'rgba(140,225,255,' + (.16 + .1 * (pulse * .5 + .5)).toFixed(3) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r + 7 + pulse * 2.5, 0, 6.283); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();   // 结束震动位移
  }

  // 游戏主循环：计算帧间隔，更新游戏状态、绘制画面，再请求下一帧。
  function loop(t){
    // 横屏时冻结物理模拟；遮罩提示用户转回竖屏，不让棋盘被横向视口重新排版。
    if(window.matchMedia && window.matchMedia('(orientation: landscape)').matches){
      last = t;
      requestAnimationFrame(loop);
      return;
    }
    const dt = Math.min((t - last) / 1000 || 0, .033);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  const cover = $('cover');
  function enterGame(){
    if(!cover || cover.classList.contains('dismissed')) return;
    cover.classList.add('dismissed');
    cover.setAttribute('aria-hidden','true');
    firstLevelIntroT = 4.8;
    setTimeout(() => { if(cover && cover.parentNode) cover.style.display = 'none'; }, 700);
  }
  setTimeout(enterGame, 2000);

  resize();
  newLevel(false);
  last = performance.now();
  requestAnimationFrame(loop);
  setTimeout(scheduleResize, 100);
})();
</script>
</body>
</html>
